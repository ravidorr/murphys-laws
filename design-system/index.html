<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Design system showcase for Murphy's Laws.">
    <title>Murphy's Laws Design System</title>
    <link rel="stylesheet" href="./tokens.css">
    <link rel="stylesheet" href="./showcase.css">
  </head>
  <body>
    <main>
      <h1>Murphy's Laws Design System</h1>
      <p>
        This showcase uses the canonical variables from
        <code>web/styles/partials/variables.css</code>.
      </p>

      <section aria-labelledby="colors">
        <h2 id="colors">Colors</h2>
        <ul class="swatches">
          <li class="swatch swatch--primary">Primary</li>
          <li class="swatch swatch--surface">Surface</li>
          <li class="swatch swatch--success">Success</li>
          <li class="swatch swatch--error">Error</li>
        </ul>
      </section>

      <section aria-labelledby="components">
        <h2 id="components">Components</h2>
        <div class="component-preview">
          <button type="button">Primary action</button>
          <button class="button--secondary" type="button">Secondary action</button>
        </div>
      </section>
    </main>
  </body>
</html>
