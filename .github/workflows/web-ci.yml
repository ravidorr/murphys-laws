name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'backend/db/migrations/**'
      - 'backend/scripts/build-sqlite.ts'
      - 'backend/src/**'
      - 'shared/modules/**'
      - 'shared/design-tokens/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'backend/db/migrations/**'
      - 'backend/scripts/build-sqlite.ts'
      - 'backend/src/**'
      - 'shared/modules/**'
      - 'shared/design-tokens/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root - npm workspaces)
        run: npm ci

      - name: Install Rollup Linux native binary (npm optional deps bug)
        run: npm install @rollup/rollup-linux-x64-gnu@4.59.0 --no-save
        if: runner.os == 'Linux'

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Lint JavaScript
        run: npm run lint
        working-directory: web

      - name: Lint CSS
        run: npm run lint:css
        working-directory: web

      - name: Lint HTML
        run: npm run lint:html
        working-directory: web

      - name: Run unit tests
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build:web

      - name: Check bundle and service-worker budgets
        run: npm run check:web-budgets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Rollup Linux native binary (npm optional deps bug)
        run: npm install @rollup/rollup-linux-x64-gnu@4.59.0 --no-save
        if: runner.os == 'Linux'

      - name: Build database for backend
        run: npm run build:db
        working-directory: backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: web

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:db
        working-directory: backend
      - name: Start production-like services
        run: |
          npm --prefix backend start > /tmp/murphys-backend.log 2>&1 &
          API_BASE_URL=http://127.0.0.1:8787 npm --prefix web run build
          npm --prefix web run preview -- --port 4173 > /tmp/murphys-web.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173 > /dev/null && curl -fsS http://127.0.0.1:8787/api/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173 > /dev/null
          curl -fsS http://127.0.0.1:8787/api/health > /dev/null
      - name: Run Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true
