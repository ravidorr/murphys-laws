name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'backend/db/migrations/**'
      - 'backend/scripts/build-sqlite.ts'
      - 'backend/src/**'
      - 'shared/modules/**'
      - 'shared/docs/**'
      - 'shared/DESIGN.md'
      - 'shared/design-tokens/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/web-ci.yml'
  pull_request:

permissions:
  contents: read
  pull-requests: read

# A newer push to a pull request supersedes the older run, so superseded runs stop holding runners.
# Runs on main always finish, so every merge keeps its own result.
concurrency:
  group: web-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'web/**'
              - 'backend/db/migrations/**'
              - 'backend/scripts/build-sqlite.ts'
              - 'backend/src/**'
              - 'shared/modules/**'
              - 'shared/docs/**'
              - 'shared/DESIGN.md'
              - 'shared/design-tokens/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '.github/workflows/web-ci.yml'
  test-and-build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root - npm workspaces)
        uses: ./.github/actions/npm-ci

      - name: Install Rollup Linux native binary (npm optional deps bug)
        run: npm install @rollup/rollup-linux-x64-gnu@4.59.0 --no-save
        if: runner.os == 'Linux'

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Lint JavaScript
        run: npm run lint
        working-directory: web

      - name: Lint CSS
        run: npm run lint:css
        working-directory: web

      - name: Lint HTML
        run: npm run lint:html
        working-directory: web

      - name: Check design system
        run: npm run design:check

      - name: Run unit tests
        run: npm run test:coverage
        working-directory: web

      - name: Build
        run: npm run build:web

      - name: Check generated web conformance
        run: npm run design:conformance

      - name: Check bundle and service-worker budgets
        run: npm run check:web-budgets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

  e2e-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # A healthy run takes about three minutes. Without a limit, a hung apt mirror or browser download
    # holds the runner for the 6-hour default and leaves the pull request waiting on web-ci-gate.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Install Rollup Linux native binary (npm optional deps bug)
        run: npm install @rollup/rollup-linux-x64-gnu@4.59.0 --no-save
        if: runner.os == 'Linux'

      - name: Build database for backend
        run: npm run build:db
        working-directory: backend

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
        working-directory: web

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # The suite only runs the chromium project, so only chromium and its system packages are installed.
      # The system packages come from the runner's apt mirror, which is sometimes slow or unreachable and
      # fails the whole job for a reason that has nothing to do with the change under test, so retry them.
      - name: Install Playwright system dependencies
        run: |
          for attempt in 1 2 3; do
            if timeout 120 npx playwright install-deps chromium; then
              exit 0
            fi
            echo "::warning::playwright install-deps failed (attempt ${attempt} of 3)"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "::error::playwright install-deps failed three times"
          exit 1
        working-directory: web

      - name: Install Playwright chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          for attempt in 1 2 3; do
            if timeout 120 npx playwright install chromium; then
              exit 0
            fi
            echo "::warning::playwright install failed (attempt ${attempt} of 3)"
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 20))
            fi
          done
          echo "::error::playwright install failed three times"
          exit 1
        working-directory: web

      # web/e2e/prerender-law-of-day.spec.ts reads the production build (web/dist) to check that the prerendered
      # Law of the Day has the same geometry as the app's, so the build has to exist before the suite runs.
      - name: Build the web app for the prerender layout spec
        run: npm run build:web

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: web

      # The list reporter writes no HTML report; screenshots and videos of failed tests land in test-results.
      - name: Upload Playwright results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - uses: ./.github/actions/npm-ci
      - run: npm run build:db
        working-directory: backend
      - name: Start production-like services
        run: |
          npm --prefix backend start > /tmp/murphys-backend.log 2>&1 &
          API_BASE_URL=http://127.0.0.1:8787 npm --prefix web run build
          npm --prefix web run preview -- --port 4173 > /tmp/murphys-web.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173 > /dev/null && curl -fsS http://127.0.0.1:8787/api/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173 > /dev/null
          curl -fsS http://127.0.0.1:8787/api/health > /dev/null
      - name: Warm up preview routes before Lighthouse
        run: |
          set -euo pipefail
          urls=(
            http://127.0.0.1:4173/
            http://127.0.0.1:4173/browse
          )
          for round in 1 2 3; do
            for url in "${urls[@]}"; do
              curl -fsS "$url" > /dev/null
            done
            sleep 2
          done
      - name: Run Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true

  ci-gate:
    name: web-ci-gate
    needs: [changes, test-and-build, e2e-tests, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify applicable CI completed successfully
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          TEST_AND_BUILD_RESULT: ${{ needs.test-and-build.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
        run: |
          if [ "$CHANGES_RESULT" = "success" ] && [ "$RELEVANT" = "false" ]; then
            echo "No relevant changes; web CI is not required."
            exit 0
          fi
          if [ "$TEST_AND_BUILD_RESULT" = "success" ] \
            && [ "$E2E_RESULT" = "success" ] \
            && [ "$LIGHTHOUSE_RESULT" = "success" ]; then
            echo "Applicable web CI completed successfully."
            exit 0
          fi
          echo "Web CI results: build=$TEST_AND_BUILD_RESULT e2e=$E2E_RESULT lighthouse=$LIGHTHOUSE_RESULT"
          exit 1
