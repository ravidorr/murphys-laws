name: Web CI

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'backend/db/migrations/**'
      - 'backend/scripts/build-sqlite.ts'
      - 'backend/src/**'
      - 'shared/modules/**'
      - 'shared/DESIGN.md'
      - 'shared/design-tokens/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/web-ci.yml'
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'web/**'
              - 'backend/db/migrations/**'
              - 'backend/scripts/build-sqlite.ts'
              - 'backend/src/**'
              - 'shared/modules/**'
              - 'shared/DESIGN.md'
              - 'shared/design-tokens/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '.github/workflows/web-ci.yml'
  test-and-build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root - npm workspaces)
        run: npm ci

      - name: Install Rollup Linux native binary (npm optional deps bug)
        run: npm install @rollup/rollup-linux-x64-gnu@4.59.0 --no-save
        if: runner.os == 'Linux'

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      - name: Lint JavaScript
        run: npm run lint
        working-directory: web

      - name: Lint CSS
        run: npm run lint:css
        working-directory: web

      - name: Lint HTML
        run: npm run lint:html
        working-directory: web

      - name: Check design system
        run: npm run design:check

      - name: Run unit tests
        run: npm test
        working-directory: web

      - name: Build
        run: npm run build:web

      - name: Check generated web conformance
        run: npm run design:conformance

      - name: Check bundle and service-worker budgets
        run: npm run check:web-budgets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

  e2e-tests:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Rollup Linux native binary (npm optional deps bug)
        run: npm install @rollup/rollup-linux-x64-gnu@4.59.0 --no-save
        if: runner.os == 'Linux'

      - name: Build database for backend
        run: npm run build:db
        working-directory: backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: web

      - name: Run E2E tests
        run: npm run test:e2e
        working-directory: web

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  lighthouse:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build:db
        working-directory: backend
      - name: Start production-like services
        run: |
          npm --prefix backend start > /tmp/murphys-backend.log 2>&1 &
          API_BASE_URL=http://127.0.0.1:8787 npm --prefix web run build
          npm --prefix web run preview -- --port 4173 > /tmp/murphys-web.log 2>&1 &
          for attempt in {1..30}; do
            curl -fsS http://127.0.0.1:4173 > /dev/null && curl -fsS http://127.0.0.1:8787/api/health > /dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173 > /dev/null
          curl -fsS http://127.0.0.1:8787/api/health > /dev/null
      - name: Run Lighthouse budgets
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          uploadArtifacts: true

  ci-gate:
    name: web-ci-gate
    needs: [changes, test-and-build, e2e-tests, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify applicable CI completed successfully
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          TEST_AND_BUILD_RESULT: ${{ needs.test-and-build.result }}
          E2E_RESULT: ${{ needs.e2e-tests.result }}
          LIGHTHOUSE_RESULT: ${{ needs.lighthouse.result }}
        run: |
          if [ "$CHANGES_RESULT" = "success" ] && [ "$RELEVANT" = "false" ]; then
            echo "No relevant changes; web CI is not required."
            exit 0
          fi
          if [ "$TEST_AND_BUILD_RESULT" = "success" ] \
            && [ "$E2E_RESULT" = "success" ] \
            && [ "$LIGHTHOUSE_RESULT" = "success" ]; then
            echo "Applicable web CI completed successfully."
            exit 0
          fi
          echo "Web CI results: build=$TEST_AND_BUILD_RESULT e2e=$E2E_RESULT lighthouse=$LIGHTHOUSE_RESULT"
          exit 1
