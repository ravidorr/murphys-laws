name: MCP Release

# Releases the MCP npm package and matching registry manifest after MCP changes
# merge to main, or retries the process when manually dispatched from main.
# Only paths that change the published package trigger it, and the run exits before
# installing or testing anything when npm and the registry already have the version.
#
# Requires repo secret: MCP_PUBLISHER_PRIVATE_KEY for MCP Registry DNS
# authentication. npm publishing uses GitHub Actions OIDC trusted publishing.

on:
  push:
    branches: [main]
    paths:
      - 'mcp/src/**'
      - 'mcp/bin/**'
      - 'mcp/package.json'
      - 'mcp/server.json'
      - 'mcp/tsconfig.build.json'
      - 'mcp/README.md'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Read MCP release metadata
        id: server
        run: |
          PACKAGE_NAME=$(jq -r '.name' mcp/package.json)
          PACKAGE_VERSION=$(jq -r '.version' mcp/package.json)
          NAME=$(jq -r '.name' mcp/server.json)
          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Target: $NAME@$PACKAGE_VERSION -> npm:$PACKAGE_NAME@$PACKAGE_VERSION"

      - name: Check npm package state
        id: npm
        env:
          PACKAGE_NAME: ${{ steps.server.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.server.outputs.package_version }}
        run: |
          set -euo pipefail
          ERROR_FILE=$(mktemp)
          if PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org/ 2>"$ERROR_FILE"); then
            if [ "$PUBLISHED_VERSION" != "$PACKAGE_VERSION" ]; then
              echo "::error::npm returned '$PUBLISHED_VERSION' for $PACKAGE_NAME@$PACKAGE_VERSION"
              exit 1
            fi
            echo "npm already has $PACKAGE_NAME@$PACKAGE_VERSION - skipping publish"
            echo "needs_publish=false" >> "$GITHUB_OUTPUT"
          elif grep -qE 'E404|404 Not Found' "$ERROR_FILE"; then
            echo "npm does not have $PACKAGE_NAME@$PACKAGE_VERSION - publish needed"
            echo "needs_publish=true" >> "$GITHUB_OUTPUT"
          else
            cat "$ERROR_FILE" >&2
            echo "::error::Could not determine npm state for $PACKAGE_NAME@$PACKAGE_VERSION"
            exit 1
          fi

      - name: Check current registry state
        id: registry
        env:
          EXPECTED_NAME: ${{ steps.server.outputs.name }}
          EXPECTED_VERSION: ${{ steps.server.outputs.package_version }}
        run: |
          set -euo pipefail
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          curl --fail --show-error --silent --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 15 \
            --retry-max-time 120 \
            --connect-timeout 15 \
            --max-time 30 \
            --output "$RESPONSE_FILE" \
            "https://registry.modelcontextprotocol.io/v0/servers?search=${EXPECTED_NAME}&version=latest"
          node --experimental-strip-types scripts/mcp-registry-state.ts "$RESPONSE_FILE" "$EXPECTED_NAME" "$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$(grep '^needs_publish=' "$GITHUB_OUTPUT" | tail -1)" = "needs_publish=false" ]; then
            echo "Registry already has $EXPECTED_NAME@$EXPECTED_VERSION - skipping publish"
          else
            echo "Registry does not have $EXPECTED_NAME@$EXPECTED_VERSION as its latest version - publish needed"
          fi

      - name: Decide whether a release is needed
        id: plan
        env:
          NPM_NEEDS_PUBLISH: ${{ steps.npm.outputs.needs_publish }}
          REGISTRY_NEEDS_PUBLISH: ${{ steps.registry.outputs.needs_publish }}
        run: |
          if [ "$NPM_NEEDS_PUBLISH" = "true" ] || [ "$REGISTRY_NEEDS_PUBLISH" = "true" ]; then
            echo "release_needed=true" >> "$GITHUB_OUTPUT"
            echo "A release is needed - running validation and publish steps"
          else
            echo "release_needed=false" >> "$GITHUB_OUTPUT"
            echo "npm and the registry are already at the target version - nothing to release"
          fi

      - name: Install npm for trusted publishing
        if: steps.plan.outputs.release_needed == 'true'
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        if: steps.plan.outputs.release_needed == 'true'
        run: npm ci

      - name: Validate MCP release version contract
        if: steps.plan.outputs.release_needed == 'true'
        run: node --import tsx scripts/mcp-release-contract.ts

      - name: Build SDK
        if: steps.plan.outputs.release_needed == 'true'
        run: npm run build
        working-directory: sdk

      - name: Validate MCP package
        if: steps.plan.outputs.release_needed == 'true'
        run: npm run typecheck && npm run lint && npm run test:coverage && npm run build
        working-directory: mcp

      - name: Publish npm package
        if: steps.plan.outputs.release_needed == 'true' && steps.npm.outputs.needs_publish == 'true'
        run: npm publish --workspace=murphys-laws-mcp --provenance --access public

      - name: Wait for npm package availability
        if: steps.plan.outputs.release_needed == 'true'
        env:
          PACKAGE_NAME: ${{ steps.server.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.server.outputs.package_version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if PUBLISHED_VERSION=$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org/ 2>/dev/null) &&
              [ "$PUBLISHED_VERSION" = "$PACKAGE_VERSION" ]; then
              echo "npm package is publicly available: $PACKAGE_NAME@$PACKAGE_VERSION"
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then
              echo "Waiting for npm package availability ($attempt/20)"
              sleep 15
            fi
          done
          echo "::error::npm package $PACKAGE_NAME@$PACKAGE_VERSION did not become publicly available"
          exit 1

      - name: Install mcp-publisher
        if: steps.plan.outputs.release_needed == 'true' && steps.registry.outputs.needs_publish == 'true'
        run: |
          set -euo pipefail
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          URL="https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${OS}_${ARCH}.tar.gz"
          curl -fsSL "$URL" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --help >/dev/null
          echo "mcp-publisher installed"

      - name: Authenticate with registry (DNS auth)
        if: steps.plan.outputs.release_needed == 'true' && steps.registry.outputs.needs_publish == 'true'
        env:
          PRIVATE_KEY: ${{ secrets.MCP_PUBLISHER_PRIVATE_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then
            echo "::error::MCP_PUBLISHER_PRIVATE_KEY secret is not set. See mcp/README.md for setup."
            exit 1
          fi
          mcp-publisher login dns --domain murphys-laws.com --private-key "$PRIVATE_KEY"

      - name: Publish to MCP Registry
        if: steps.plan.outputs.release_needed == 'true' && steps.registry.outputs.needs_publish == 'true'
        working-directory: mcp
        run: mcp-publisher publish

      - name: Verify entry is live at expected version
        if: steps.plan.outputs.release_needed == 'true'
        env:
          EXPECTED_NAME: ${{ steps.server.outputs.name }}
          EXPECTED_VERSION: ${{ steps.server.outputs.package_version }}
          NEEDS_PUBLISH: ${{ steps.registry.outputs.needs_publish }}
        run: |
          set -euo pipefail
          # After a fresh publish, allow a beat for the registry to index.
          # No-op runs can skip the sleep.
          if [ "$NEEDS_PUBLISH" = "true" ]; then
            sleep 5
          fi
          # The search endpoint lists every published version; the tested helper picks the
          # entry the registry flags as latest instead of trusting the first match.
          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT
          curl --fail --show-error --silent --location \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 15 \
            --retry-max-time 120 \
            --connect-timeout 15 \
            --max-time 30 \
            --output "$RESPONSE_FILE" \
            "https://registry.modelcontextprotocol.io/v0/servers?search=${EXPECTED_NAME}&version=latest"
          LIVE_VERSION=$(node --experimental-strip-types scripts/mcp-registry-state.ts "$RESPONSE_FILE" "$EXPECTED_NAME" "$EXPECTED_VERSION" | sed -n 's/^live_version=//p')
          if [ -z "$LIVE_VERSION" ]; then
            echo "::error::No registry entry found for '$EXPECTED_NAME'"
            exit 1
          fi
          if [ "$LIVE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "::error::Registry shows '$EXPECTED_NAME@$LIVE_VERSION', expected '@$EXPECTED_VERSION'"
            exit 1
          fi
          echo "Registry entry verified: $EXPECTED_NAME@$LIVE_VERSION"
