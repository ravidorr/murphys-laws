name: CLI CI

on:
  push:
    branches:
      - main
    paths:
      - 'cli/**'
      - 'sdk/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/cli-ci.yml'
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'cli/**'
              - 'sdk/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '.github/workflows/cli-ci.yml'
  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root - npm workspaces)
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build SDK (CLI imports from murphys-laws-sdk/dist)
        run: npm run build
        working-directory: sdk

      - name: Typecheck
        run: npm run typecheck
        working-directory: cli

      - name: Lint
        run: npm run lint
        working-directory: cli

      - name: Run tests with coverage
        run: npm run test:coverage
        working-directory: cli

      - name: Build
        run: npm run build
        working-directory: cli

      - name: Smoke-test built binary
        run: node bin/murphy.js --version
        working-directory: cli

  ci-gate:
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify applicable CI completed successfully
        env:
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$RELEVANT" != "true" ]; then
            echo "No relevant changes; CI is not required."
            exit 0
          fi
          if [ "$TEST_RESULT" = "success" ]; then
            echo "Applicable CI completed successfully."
            exit 0
          fi
          echo "Applicable CI finished with result: $TEST_RESULT"
          exit 1
