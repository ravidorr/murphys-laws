name: Backend CI

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'shared/data/**'
      - 'shared/modules/**'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
      - '.github/workflows/backend-ci.yml'
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'backend/**'
              - 'shared/data/**'
              - 'shared/modules/**'
              - 'package.json'
              - 'package-lock.json'
              - '.nvmrc'
              - '.github/workflows/backend-ci.yml'
  test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies (root - npm workspaces)
        run: npm ci

      - name: Install locked backend dependencies
        run: npm ci --prefix backend

      - name: Install Rollup Linux native binary (npm optional deps bug)
        run: npm install @rollup/rollup-linux-x64-gnu@4.59.0 --no-save
        if: runner.os == 'Linux'

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Lint
        run: npm run lint
        working-directory: backend

      - name: Build database
        run: npm run build:db
        working-directory: backend

      - name: Run tests with coverage
        env:
          SENTRY_DSN: ''
        run: npm run test:coverage
        working-directory: backend

      - name: Check database exists
        run: test -f backend/murphys.db

  ci-gate:
    name: backend-ci-gate
    needs: [changes, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify applicable CI completed successfully
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          if [ "$CHANGES_RESULT" = "success" ] && [ "$RELEVANT" = "false" ]; then
            echo "No relevant changes; CI is not required."
            exit 0
          fi
          if [ "$TEST_RESULT" = "success" ]; then
            echo "Applicable CI completed successfully."
            exit 0
          fi
          echo "Applicable CI finished with result: $TEST_RESULT"
          exit 1
