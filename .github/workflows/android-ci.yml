name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'shared/DESIGN.md'
      - 'shared/design-tokens/**'
      - 'web/DESIGN.md'
      - 'web/styles/partials/variables.css'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'shared/DESIGN.md'
      - 'shared/design-tokens/**'
      - 'web/DESIGN.md'
      - 'web/styles/partials/variables.css'
      - '.github/workflows/android-ci.yml'

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root - npm workspaces)
        run: npm ci

      - name: Check design-system conformance
        run: npm run design:conformance

      - name: Regenerate Android design tokens
        run: npm run design:export:android

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check for Gradle wrapper
        id: check_gradle
        run: |
          if [ -f "android/gradlew" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Make gradlew executable
        if: steps.check_gradle.outputs.exists == 'true'
        run: chmod +x android/gradlew

      - name: Build, lint, and unit tests (if project exists)
        if: steps.check_gradle.outputs.exists == 'true'
        run: |
          cd android
          ./gradlew assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest \
            --no-daemon \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:MaxMetaspaceSize=768m" \
            --max-workers=4

      - name: Run instrumentation tests (if project exists)
        if: steps.check_gradle.outputs.exists == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: cd android && ./gradlew connectedDebugAndroidTest --no-daemon --build-cache --max-workers=2

      - name: Upload APK
        if: steps.check_gradle.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: Skip (project not yet created)
        if: steps.check_gradle.outputs.exists == 'false'
        run: echo "Android project not yet created. Skipping build."
