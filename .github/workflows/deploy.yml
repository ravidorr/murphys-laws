name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    # A manual run can be started from any branch; only main may reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        uses: ./.github/actions/npm-ci

      - name: Install Rollup Linux native binary (npm optional deps bug)
        run: npm install @rollup/rollup-linux-x64-gnu@4.59.0 --no-save
        if: runner.os == 'Linux'

      # The static pages are prerendered from a COPY of the production database, taken here at build time and
      # never committed or uploaded: the archive numbers and publishes laws differently from production (every
      # law page then described the wrong law), and prerendering from the live API ran before the server migrated,
      # so a data-fixing migration in the same deploy could never take effect.
      #
      # 1. The sanitizer is streamed to the server over the SSH access the deploy already uses (the server still
      #    runs the previous release, so it cannot be uploaded first). On the server it takes a consistent
      #    .backup of the live database and sanitizes THAT COPY (an allowlist of tables, contact details and
      #    voter identifiers removed, VACUUMed), so the private data never leaves the server (text that is already public
      #    is copied as it is, and the copy is deleted when the job ends). Only the sanitized
      #    file is streamed back, which is why no scp is needed.
      # 2. The build then applies this release's pending migrations to the copy (the same ones the server runs
      #    after the upload below) and prerenders from a local API that serves the copy.
      # Any failure here stops the job before anything is uploaded: there is no fallback to the archive or to a
      # stale site. If the server cannot be reached the deploy could not upload or migrate either.
      - name: Fetch a sanitized copy of the production database
        env:
          SERVER_HOST: ${{ secrets['SERVER_HOST'] }}
          SERVER_USER: ${{ secrets['SERVER_USER'] }}
          SSH_PRIVATE_KEY: ${{ secrets['SSH_PRIVATE_KEY'] }}
          # Optional: the server's line from `ssh-keyscan -t ed25519 <host>`. When set, the host key is pinned.
          SERVER_HOST_KEY: ${{ secrets['SERVER_HOST_KEY'] }}
        run: |
          set -euo pipefail
          umask 077
          : "${SERVER_HOST:?the SERVER_HOST secret is not set}" "${SERVER_USER:?the SERVER_USER secret is not set}" "${SSH_PRIVATE_KEY:?the SSH_PRIVATE_KEY secret is not set}"
          command -v sqlite3 > /dev/null || { echo "::error::sqlite3 is not installed on the runner"; exit 1; }

          ssh_dir="$RUNNER_TEMP/deploy-ssh"
          copy_dir="$RUNNER_TEMP/prod-db-copy"
          mkdir -p "$ssh_dir" "$copy_dir"
          chmod 700 "$ssh_dir" "$copy_dir"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$ssh_dir/key"
          chmod 600 "$ssh_dir/key"

          # With a pinned host key the connection is refused when the server presents another one. Without it the
          # key is trusted on first use, which is how the upload and deploy steps below connect too.
          if [ -n "$(printf '%s' "${SERVER_HOST_KEY:-}" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$SERVER_HOST_KEY" > "$ssh_dir/known_hosts"
            host_key_check=yes
          else
            echo "::warning::The SERVER_HOST_KEY secret is not set, so the server's host key is not verified (see shared/docs/GITHUB-SECRETS-SETUP.md)"
            host_key_check=accept-new
          fi

          # The script is read from stdin (it is not on the server yet) and the sanitized database comes back on
          # stdout; everything the script reports goes to stderr, and it never prints a row.
          ssh -i "$ssh_dir/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking="$host_key_check" -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            "$SERVER_USER@$SERVER_HOST" \
            'sudo bash -s -- export /root/murphys-laws/backend/murphys.db' \
            < backend/scripts/sanitize-db-copy.sh > "$copy_dir/murphys.db"
          rm -f "$ssh_dir/key"

          # A startup file on the server that prints to stdout would corrupt the stream: say so plainly.
          [ "$(head -c 15 "$copy_dir/murphys.db")" = "SQLite format 3" ] \
            || { echo "::error::the server did not send a SQLite database (a remote shell startup file may be printing to stdout)"; exit 1; }

          # Check the copy again here, on the runner, before anything is built from it. Counts only, no rows.
          bash backend/scripts/sanitize-db-copy.sh verify "$copy_dir/murphys.db"
          [ "$(sqlite3 "$copy_dir/murphys.db" 'PRAGMA integrity_check;')" = "ok" ] \
            || { echo "::error::the fetched database failed its integrity check"; exit 1; }
          laws="$(sqlite3 "$copy_dir/murphys.db" "SELECT COUNT(*) FROM laws WHERE status = 'published';")"
          [ "$laws" -gt 0 ] || { echo "::error::the fetched database holds no published law"; exit 1; }
          echo "Fetched a sanitized copy: $laws published laws, $(wc -c < "$copy_dir/murphys.db" | tr -d ' ') bytes"

      - name: Build project
        run: |
          npm run build:openapi
          npm run build:web
        env:
          # npm run build:web migrates this copy, serves it from a local API and prerenders from that API
          MURPHYS_DB_PATH: ${{ runner.temp }}/prod-db-copy/murphys.db
          # The release name of the bundle and of the uploaded source maps: the commit, never a timestamp, so the
          # same commit always builds the same bundle file names (web/scripts/app-release.ts)
          VITE_APP_VERSION: ${{ github.sha }}
          # Sentry configuration for frontend error tracking and source map upload
          VITE_SENTRY_DSN: ${{ secrets['SENTRY_DSN'] }}
          SENTRY_AUTH_TOKEN: ${{ secrets['SENTRY_AUTH_TOKEN'] }}
          SENTRY_ORG: ${{ secrets['SENTRY_ORG'] }}
          SENTRY_PROJECT: ${{ secrets['SENTRY_PROJECT'] }}
          SENTRY_UPLOAD: 'true'

      # Runs whether the fetch or the build passed or failed. The copy is never uploaded (the upload step names
      # its sources) and is never kept as an artifact.
      - name: Delete the database copy and the SSH key
        if: always()
        run: rm -rf "$RUNNER_TEMP/prod-db-copy" "$RUNNER_TEMP/deploy-ssh"

      - name: Check monitoring recipient secrets
        env:
          ALERT_EMAIL: ${{ secrets['ALERT_EMAIL'] }}
          EMAIL_TO: ${{ secrets['EMAIL_TO'] }}
        run: |
          # The monitoring scripts have no built-in address, so a deploy without one would silently turn
          # every alert off. Stop before anything reaches the server. A blank or whitespace-only secret
          # counts as unset, as it does in the scripts.
          if [ -z "$(printf '%s%s' "$ALERT_EMAIL" "$EMAIL_TO" | tr -d '[:space:]')" ]; then
            echo "::error::Set the ALERT_EMAIL or EMAIL_TO repository secret; without a recipient the monitoring alerts have nowhere to go (see shared/docs/GITHUB-SECRETS-SETUP.md)"
            exit 1
          fi

      - name: Upload build artifacts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets['SERVER_HOST'] }}
          username: ${{ secrets['SERVER_USER'] }}
          key: ${{ secrets['SSH_PRIVATE_KEY'] }}
          source: "web/dist/,backend/src/,backend/scripts/,backend/db/,backend/config/,backend/package.json,backend/package-lock.json,backend/ecosystem.config.cjs,shared/modules/,nginx.conf,web/vite.config.js,.nvmrc"
          target: "/home/${{ secrets['SERVER_USER'] }}/deploy/murphys-laws/"
          overwrite: true

      - name: Check ADMIN_API_TOKEN secret
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ "${#ADMIN_API_TOKEN}" -lt 32 ]; then
            echo "::warning::ADMIN_API_TOKEN secret is empty or shorter than 32 characters; the admin moderation API will be disabled"
          fi

      - name: Check admin GitHub sign-in secrets
        env:
          # Repository secrets cannot start with GITHUB_, so these two are stored as ADMIN_GITHUB_OAUTH_*.
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.ADMIN_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.ADMIN_GITHUB_OAUTH_CLIENT_SECRET }}
          ADMIN_GITHUB_USERS: ${{ secrets.ADMIN_GITHUB_USERS }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
        run: |
          if [ -n "$GITHUB_OAUTH_CLIENT_ID$GITHUB_OAUTH_CLIENT_SECRET$ADMIN_GITHUB_USERS$ADMIN_SESSION_SECRET" ]; then
            if [ -z "$GITHUB_OAUTH_CLIENT_ID" ] || [ -z "$GITHUB_OAUTH_CLIENT_SECRET" ] || [ -z "$ADMIN_GITHUB_USERS" ] || [ "${#ADMIN_SESSION_SECRET}" -lt 32 ]; then
              echo "::warning::Admin GitHub sign-in is only partly configured (all of GITHUB_OAUTH_CLIENT_ID, GITHUB_OAUTH_CLIENT_SECRET, ADMIN_GITHUB_USERS and a 32+ character ADMIN_SESSION_SECRET are needed); sign-in will stay disabled"
            fi
          fi

      - name: Deploy and restart services
        uses: appleboy/ssh-action@v1.0.0
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets['SERVER_HOST'] }}
          username: ${{ secrets['SERVER_USER'] }}
          key: ${{ secrets['SSH_PRIVATE_KEY'] }}
          envs: GITHUB_SHA,GITHUB_ACTOR
          script: |
            set -e
            echo "==> Deploy: creating directories"
            STAGING_DIR="$HOME/deploy/murphys-laws"
            TARGET_DIR="/root/murphys-laws"

            sudo install -d -m 755 "$STAGING_DIR"
            sudo install -d -m 755 "$TARGET_DIR"

            sudo install -d -m 755 "$TARGET_DIR/web"
            sudo install -d -m 755 "$TARGET_DIR/web/dist"
            sudo install -d -m 755 "$TARGET_DIR/backend"
            sudo install -d -m 755 "$TARGET_DIR/backend/src"
            sudo install -d -m 755 "$TARGET_DIR/backend/scripts"
            sudo install -d -m 755 "$TARGET_DIR/backend/db"
            sudo install -d -m 755 "$TARGET_DIR/backend/config"
            sudo install -d -m 755 "$TARGET_DIR/backend/logs"
            sudo install -d -m 755 "$TARGET_DIR/shared"
            sudo install -d -m 755 "$TARGET_DIR/shared/modules"

            sudo install -d -m 755 /etc/murphys-laws
            if [ -f "$TARGET_DIR/backend/config/infrastructure-inventory.json" ] && [ ! -f /etc/murphys-laws/infrastructure-inventory.json ]; then
              sudo cp "$TARGET_DIR/backend/config/infrastructure-inventory.json" /etc/murphys-laws/infrastructure-inventory.json
              sudo chmod 644 /etc/murphys-laws/infrastructure-inventory.json
            fi

            # The monitoring scripts are installed (by install-maintenance-scripts.sh, below) with failures not ignored, so
            # make sure they and that script arrived before the live site is touched; failing later would leave a half-applied release.
            for script in alert-email backup-murphys backup-offsite health-monitor ssl-monitor cost-optimization-report test-backup-restore install-maintenance-scripts; do
              [ -f "$STAGING_DIR/backend/scripts/$script.sh" ] \
                || { echo "ERROR: $script.sh is missing from the uploaded release; nothing was changed on the server" >&2; exit 1; }
            done

            # A rejected nginx.conf must stop the deploy before anything on the live tree is replaced. nginx only
            # tests /etc/nginx, so the uploaded copy is installed as the site file and tested here; the previous file
            # is put back on rejection, and by the exit trap if the release fails before the reload. No `cmd && nginx
            # -t` list: set -e ignores a failure in it. See shared/docs/DEPLOYMENT.md, "A rejected nginx configuration".
            echo "==> Deploy: testing nginx.conf before the release replaces anything"
            NGINX_SITE=/etc/nginx/sites-available/murphys-laws
            NGINX_PREVIOUS=""
            if [ -f "$NGINX_SITE" ]; then
              NGINX_PREVIOUS="$(sudo mktemp)"
              sudo cp -p "$NGINX_SITE" "$NGINX_PREVIOUS" \
                || { echo "ERROR: could not back up $NGINX_SITE; nothing was changed" >&2; sudo rm -f "$NGINX_PREVIOUS"; exit 1; }
            fi
            if ! { sudo cp "$STAGING_DIR/nginx.conf" "$NGINX_SITE" && sudo nginx -t; }; then
              echo "ERROR: nginx.conf could not be installed or nginx rejected it; restoring the previous site file; nginx is not reloaded and nothing on the live tree was replaced" >&2
              if [ -n "$NGINX_PREVIOUS" ]; then
                sudo cp -p "$NGINX_PREVIOUS" "$NGINX_SITE" \
                  || { echo "ERROR: could not restore $NGINX_SITE; the previous copy is in $NGINX_PREVIOUS" >&2; exit 1; }
                sudo rm -f "$NGINX_PREVIOUS"
              else
                sudo rm -f "$NGINX_SITE"
              fi
              exit 1
            fi
            nginx_restore_after_failure() {
              echo "ERROR: the deploy failed after nginx accepted nginx.conf and before nginx was reloaded; restoring the previous site file" >&2
              if [ -n "$NGINX_PREVIOUS" ]; then
                sudo cp -p "$NGINX_PREVIOUS" "$NGINX_SITE" \
                  && sudo rm -f "$NGINX_PREVIOUS" \
                  || echo "ERROR: could not restore $NGINX_SITE; the previous copy is in $NGINX_PREVIOUS" >&2
              else
                sudo rm -f "$NGINX_SITE" || echo "ERROR: could not remove $NGINX_SITE" >&2
              fi
            }
            trap 'if [ "$?" -ne 0 ]; then nginx_restore_after_failure; fi' EXIT

            sudo rsync -a --delete "$STAGING_DIR/web/dist/" "$TARGET_DIR/web/dist/"
            sudo rsync -a --delete "$STAGING_DIR/backend/src/" "$TARGET_DIR/backend/src/"
            # select-law-of-day.mjs became .ts. The exclusion keeps the stale staging copy from coming back and keeps
            # --delete from removing the server's copy, which the Law of the Day installer removes below with its cron line.
            sudo rsync -a --delete --exclude='select-law-of-day.mjs' "$STAGING_DIR/backend/scripts/" "$TARGET_DIR/backend/scripts/"
            sudo rsync -a --delete "$STAGING_DIR/backend/db/" "$TARGET_DIR/backend/db/"
            sudo rsync -a --delete "$STAGING_DIR/backend/config/" "$TARGET_DIR/backend/config/"
            sudo rsync -a --delete "$STAGING_DIR/shared/modules/" "$TARGET_DIR/shared/modules/"

            sudo install -m 644 "$STAGING_DIR/backend/ecosystem.config.cjs" "$TARGET_DIR/backend/ecosystem.config.cjs"
            sudo install -m 644 "$STAGING_DIR/nginx.conf" "$TARGET_DIR/nginx.conf"
            sudo install -m 644 "$STAGING_DIR/.nvmrc" "$TARGET_DIR/.nvmrc"
            sudo install -m 644 "$STAGING_DIR/backend/package.json" "$TARGET_DIR/backend/package.json"
            sudo install -m 644 "$STAGING_DIR/backend/package-lock.json" "$TARGET_DIR/backend/package-lock.json"
            sudo install -m 644 "$STAGING_DIR/web/vite.config.js" "$TARGET_DIR/web/vite.config.js"

            sudo chown -R root:root "$TARGET_DIR"

            # Retention: staging and web root pile up old hashed bundles (about 650 MB). Drop those older than 30 days
            # that nothing in the current build reaches and the retained nginx access logs show nobody requesting, from
            # staging too (or rsync brings them back). It deletes nothing when a safety check fails (also when no access
            # log can be read: the glob then stays literal) and never blocks a release: a non-zero exit only warns. A hang
            # is cut off after 180 s, well inside the ssh action's ten minute command_timeout (the first run took 69 s).
            # Node comes from root's nvm. To turn it off, delete this block; --dry-run only reports.
            echo "==> Deploy: pruning stale build assets"
            prune_rc=0
            sudo env STAGING_DIR="$STAGING_DIR" TARGET_DIR="$TARGET_DIR" bash -c 'export NVM_DIR=/root/.nvm; [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" >/dev/null 2>&1; cd "$TARGET_DIR" && nvm use --silent >/dev/null 2>&1; node --version; timeout 180 node "$TARGET_DIR/backend/scripts/prune-stale-assets.mjs" $(for log in /var/log/nginx/access.log*; do printf -- "--access-log %s " "$log"; done) "$STAGING_DIR/web/dist" "$TARGET_DIR/web/dist" 2>&1' || prune_rc=$?
            if [ "$prune_rc" -ne 0 ]; then
              echo "WARNING: stale asset pruning did not complete (exit $prune_rc: 1 means a safety check stopped it before any deletion or the script could not run, 3 means some deletions failed, 124 means it timed out, anything else means it could not start, for example no node; see its output above); the deploy continues"
            fi

            # nginx.conf was tested before the release replaced anything, so only the reload is left; it waits for
            # the new files. A failed reload fails the deploy and the exit trap restores the previous site file.
            echo "==> Deploy: reloading nginx"
            sudo systemctl reload nginx
            trap - EXIT
            # Only the backup is left: failing to remove it must not stop the migrations and the restart.
            [ -z "$NGINX_PREVIOUS" ] || sudo rm -f "$NGINX_PREVIOUS" \
              || echo "WARNING: could not remove the backup $NGINX_PREVIOUS of the previous site file" >&2

            sudo --preserve-env=GITHUB_SHA,GITHUB_ACTOR bash <<'INNER'
            set -e
            trap 'echo "==> Script failed at line $LINENO"' ERR
            TARGET_DIR="/root/murphys-laws"

            echo "==> Loading nvm and checking Node"
            export NVM_DIR="/root/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd "$TARGET_DIR"
            if [ ! -f .nvmrc ]; then
              echo "ERROR: Missing $TARGET_DIR/.nvmrc"
              exit 1
            fi
            nvm install
            nvm use
            if ! command -v pm2 > /dev/null; then
              npm install --global pm2
            fi

            # Verify Node version matches .nvmrc
            ACTUAL_NODE_VERSION=$(node --version)
            EXPECTED_NODE_VERSION=$(tr -d '[:space:]' < "$TARGET_DIR/.nvmrc")
            case "$ACTUAL_NODE_VERSION" in
              "v$EXPECTED_NODE_VERSION"|"v$EXPECTED_NODE_VERSION".*) ;;
              *)
              echo "ERROR: Node version mismatch!"
              echo "Expected (from .nvmrc): $EXPECTED_NODE_VERSION"
              echo "Actual: $ACTUAL_NODE_VERSION"
              exit 1
              ;;
            esac
            echo "✓ Node version verified: $ACTUAL_NODE_VERSION"

            # Clean up old root-level files from pre-monorepo structure
            rm -f package.json ecosystem.config.cjs .env 2>/dev/null || true
            rm -rf config modules scripts utils logs 2>/dev/null || true

            cd "$TARGET_DIR/backend"

            # Backup production database before migrations
            cp murphys.db murphys.db.backup 2>/dev/null || true

            # Create .env file with secrets (delimiter chosen to avoid secrets breaking heredoc)
            cat > .env << '__ENV_END__'
            HOST=127.0.0.1
            PORT=8787
            NODE_ENV=production
            SMTP_HOST=${{ secrets['SMTP_HOST'] }}
            SMTP_PORT=${{ secrets['SMTP_PORT'] }}
            SMTP_USER=${{ secrets['SMTP_USER'] }}
            SMTP_PASS=${{ secrets['SMTP_PASS'] }}
            EMAIL_FROM=${{ secrets['EMAIL_FROM'] }}
            EMAIL_TO=${{ secrets['EMAIL_TO'] }}
            ALERT_EMAIL=${{ secrets['ALERT_EMAIL'] }}
            HEALTH_CHECK_EMAIL_TO=${{ secrets['HEALTH_CHECK_EMAIL_TO'] }}
            ALLOWED_ORIGINS=${{ secrets['ALLOWED_ORIGINS'] }}
            SENTRY_DSN=${{ secrets['SENTRY_DSN'] }}
            ADMIN_API_TOKEN=${{ secrets['ADMIN_API_TOKEN'] }}
            GITHUB_OAUTH_CLIENT_ID=${{ secrets['ADMIN_GITHUB_OAUTH_CLIENT_ID'] }}
            GITHUB_OAUTH_CLIENT_SECRET=${{ secrets['ADMIN_GITHUB_OAUTH_CLIENT_SECRET'] }}
            ADMIN_GITHUB_USERS=${{ secrets['ADMIN_GITHUB_USERS'] }}
            ADMIN_SESSION_SECRET=${{ secrets['ADMIN_SESSION_SECRET'] }}
            VAPID_PUBLIC_KEY=${{ secrets['VAPID_PUBLIC_KEY'] }}
            VAPID_PRIVATE_KEY=${{ secrets['VAPID_PRIVATE_KEY'] }}
            VAPID_SUBJECT=${{ secrets['VAPID_SUBJECT'] }}
            __ENV_END__

            # The optional recipients are left out when unset instead of being written as empty values
            sed -i -e '/^ALERT_EMAIL=$/d' -e '/^HEALTH_CHECK_EMAIL_TO=$/d' .env

            echo "==> Contents of $TARGET_DIR/backend:"
            ls -la

            if [ ! -f package.json ]; then
              echo "package.json missing in $TARGET_DIR/backend" >&2
              exit 1
            fi

            echo "==> Installing locked backend dependencies"
            # canvas downloads a prebuilt binary from GitHub Releases, which can fail on an outside outage; npm ci
            # has already removed node_modules by then, so retry it here as the CI workflows do (a composite
            # action cannot run inside this script).
            installed=0
            for attempt in 1 2 3; do
              if npm ci; then
                installed=1
                break
              fi
              echo "npm ci failed (attempt ${attempt} of 3)" >&2
              if [ "$attempt" -lt 3 ]; then
                sleep $((attempt * 20))
              fi
            done
            if [ "$installed" -ne 1 ]; then
              echo "npm ci failed three times" >&2
              exit 1
            fi

            # npm ci can exit 0 and still leave a package without its entry file, which only shows up later
            # as a crashing health check; stop before the migrations and the restart if one is unusable
            echo "==> Verifying installed dependencies resolve"
            node scripts/verify-installed-dependencies.mjs

            echo "==> Running migrations"
            npm run migrate

            # Installs the monitoring and report scripts on the server (backend/scripts/install-maintenance-scripts.sh).
            # A failed copy of a script that must not go stale fails the deploy with that script's exit status. Its stdin
            # is /dev/null, because the real one is the rest of this script.
            bash "$TARGET_DIR/backend/scripts/install-maintenance-scripts.sh" "$TARGET_DIR" </dev/null || exit $?

            # The daily report runs the vulnerability scanner, so a standalone cron entry for it is removed from root's
            # crontab (backend/scripts/remove-scanner-cron.sh, which explains why it never empties the crontab). This is
            # housekeeping and must never block a release: every problem only prints a WARNING, and so does a script that
            # cannot run. Its stdin is /dev/null, as above.
            echo "==> Removing the standalone vulnerability scanner cron job, if there is one"
            bash "$TARGET_DIR/backend/scripts/remove-scanner-cron.sh" </dev/null \
              || echo "WARNING: the scanner cron cleanup did not finish (exit $?, see the message above); root's crontab may be unchanged and the deploy continues" >&2

            # The Law of the Day schedule (/etc/cron.d, from backend/config/cron.d). The release files and the locked
            # dependencies are in place, and the job first runs at 00:00 UTC, so this does not wait for the restart.
            # It also removes the old select-law-of-day line from root's crontab, never writing an empty one. Like the
            # cleanup above it must never block a release (the API picks the law on the first request of the day when
            # the job is not installed), so a failure only prints a WARNING and the deploy goes on. The job runs the node
            # this script runs with (the nvm node of .nvmrc, which npm ci built better-sqlite3 for), written into the
            # cron file as an absolute path, so a Node upgrade is picked up by the next deploy. The installer reads
            # nothing from stdin, which here is the rest of this script, so it is closed.
            echo "==> Installing the Law of the Day schedule"
            law_of_day_node="$(readlink -f "$(command -v node)")" || law_of_day_node=""
            law_of_day_status=0
            LAW_OF_DAY_NODE_BIN="$law_of_day_node" bash "$TARGET_DIR/backend/scripts/install-law-of-day-cron.sh" "$TARGET_DIR" </dev/null || law_of_day_status=$?
            if [ "$law_of_day_status" -ne 0 ]; then
              echo "WARNING: the Law of the Day schedule was not installed (exit $law_of_day_status, see the message above); nothing picks the law at midnight until a deploy installs it, so the first request of each day does, and the deploy continues" >&2
            fi

            echo "==> Restarting PM2"
            cd "$TARGET_DIR/backend"
            pm2 delete all || true
            # PM2 restores its saved process list during an update. Synchronize
            # only after deleting the API so it cannot restart against files that
            # are newer than the installed dependencies or database schema.
            pm2 update
            pm2 start ecosystem.config.cjs
            pm2 save

            # Verify PM2 is using Node.js 22.x without pinning to one patch version
            PM2_INTERPRETER=$(pm2 jlist | jq -r '.[] | select(.name=="murphys-api") | .pm2_env.exec_interpreter')
            if [[ -z "$PM2_INTERPRETER" || "$PM2_INTERPRETER" == "null" ]]; then
              echo "ERROR: Could not determine PM2 interpreter for murphys-api"
              pm2 list
              exit 1
            fi

            if [[ "$PM2_INTERPRETER" == "node" ]]; then
              PM2_NODE_VERSION=$(node --version)
            else
              PM2_NODE_VERSION=$("$PM2_INTERPRETER" --version 2>/dev/null || true)
            fi

            if [[ ! "$PM2_NODE_VERSION" =~ ^v22\. ]]; then
              echo "ERROR: PM2 is not using Node 22.x!"
              echo "Expected: v22.x"
              echo "Interpreter: $PM2_INTERPRETER"
              echo "Actual version: ${PM2_NODE_VERSION:-unknown}"
              pm2 logs --lines 50 --nostream
              exit 1
            fi
            echo "✓ PM2 interpreter verified: $PM2_INTERPRETER ($PM2_NODE_VERSION)"

            # Wait for services to start
            sleep 5

            # Verify PM2 processes are healthy
            echo "Checking PM2 process status..."
            pm2 list

            # Check for any error logs
            echo "Checking for errors in PM2 logs..."
            if pm2 logs murphys-api --lines 20 --nostream | grep -i "error\|module.*version"; then
              echo "⚠️  WARNING: Errors detected in logs"
            fi

            echo "==> Health check: testing API endpoints"
            if ! npx tsx scripts/wait-for-health-check.ts \
              "Law of the day endpoint" \
              "http://127.0.0.1:8787/api/v1/law-of-day"; then
              echo "ERROR: API health check failed after deployment!"
              echo "PM2 Status:"
              pm2 list
              echo "Recent logs:"
              pm2 logs --lines 50 --nostream
              exit 1
            fi

            # Test additional endpoints
            if ! npx tsx scripts/wait-for-health-check.ts \
              "Laws endpoint" \
              "http://127.0.0.1:8787/api/v1/laws?limit=1"; then
              echo "ERROR: Laws endpoint health check failed!"
              pm2 logs --lines 50 --nostream
              exit 1
            fi

            echo "✅ Deployment successful - API is healthy"
            echo "✅ All health checks passed"
            INNER

      - name: Detect daily email renderer changes
        id: daily_email_template
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Manual run; skipping template smoke email."
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No prior SHA on push; will attempt template smoke email if configured."
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$AFTER" | grep -qx 'backend/scripts/render-daily-report.ts'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send daily email template smoke test
        if: steps.daily_email_template.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.0.0
        env:
          DAILY_REPORT_TEST_RECIPIENT: ${{ secrets['DAILY_REPORT_TEST_RECIPIENT'] }}
        with:
          host: ${{ secrets['SERVER_HOST'] }}
          username: ${{ secrets['SERVER_USER'] }}
          key: ${{ secrets['SSH_PRIVATE_KEY'] }}
          envs: DAILY_REPORT_TEST_RECIPIENT
          script: |
            if [ -z "${DAILY_REPORT_TEST_RECIPIENT:-}" ]; then
              echo "DAILY_REPORT_TEST_RECIPIENT secret not set; skipping template smoke email."
              exit 0
            fi
            sudo DAILY_REPORT_TEST_RECIPIENT="$DAILY_REPORT_TEST_RECIPIENT" \
              REPO_ROOT=/root/murphys-laws \
              /usr/local/bin/daily-report.sh --test-email

      - name: Smoke test production routes
        run: npm run smoke:production
