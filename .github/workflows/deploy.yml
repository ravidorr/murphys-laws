name: Deploy to Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Rollup Linux native binary (npm optional deps bug)
        run: npm install @rollup/rollup-linux-x64-gnu@4.59.0 --no-save
        if: runner.os == 'Linux'

      - name: Build project
        run: |
          npm run build:openapi
          npm run build:web
        env:
          # Sentry configuration for frontend error tracking and source map upload
          VITE_SENTRY_DSN: ${{ secrets['SENTRY_DSN'] }}
          SENTRY_AUTH_TOKEN: ${{ secrets['SENTRY_AUTH_TOKEN'] }}
          SENTRY_ORG: ${{ secrets['SENTRY_ORG'] }}
          SENTRY_PROJECT: ${{ secrets['SENTRY_PROJECT'] }}
          SENTRY_UPLOAD: 'true'

      - name: Check monitoring recipient secrets
        env:
          ALERT_EMAIL: ${{ secrets['ALERT_EMAIL'] }}
          EMAIL_TO: ${{ secrets['EMAIL_TO'] }}
        run: |
          # The monitoring scripts have no built-in address, so a deploy without one would silently turn
          # every alert off. Stop before anything reaches the server. A blank or whitespace-only secret
          # counts as unset, as it does in the scripts.
          if [ -z "$(printf '%s%s' "$ALERT_EMAIL" "$EMAIL_TO" | tr -d '[:space:]')" ]; then
            echo "::error::Set the ALERT_EMAIL or EMAIL_TO repository secret; without a recipient the monitoring alerts have nowhere to go (see shared/docs/GITHUB-SECRETS-SETUP.md)"
            exit 1
          fi

      - name: Upload build artifacts
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets['SERVER_HOST'] }}
          username: ${{ secrets['SERVER_USER'] }}
          key: ${{ secrets['SSH_PRIVATE_KEY'] }}
          source: "web/dist/,backend/src/,backend/scripts/,backend/db/,backend/config/,backend/package.json,backend/package-lock.json,backend/ecosystem.config.cjs,shared/modules/,nginx.conf,web/vite.config.js,.nvmrc"
          target: "/home/${{ secrets['SERVER_USER'] }}/deploy/murphys-laws/"
          overwrite: true

      - name: Check ADMIN_API_TOKEN secret
        env:
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
        run: |
          if [ "${#ADMIN_API_TOKEN}" -lt 32 ]; then
            echo "::warning::ADMIN_API_TOKEN secret is empty or shorter than 32 characters; the admin moderation API will be disabled"
          fi

      - name: Check admin GitHub sign-in secrets
        env:
          # Repository secrets cannot start with GITHUB_, so these two are stored as ADMIN_GITHUB_OAUTH_*.
          GITHUB_OAUTH_CLIENT_ID: ${{ secrets.ADMIN_GITHUB_OAUTH_CLIENT_ID }}
          GITHUB_OAUTH_CLIENT_SECRET: ${{ secrets.ADMIN_GITHUB_OAUTH_CLIENT_SECRET }}
          ADMIN_GITHUB_USERS: ${{ secrets.ADMIN_GITHUB_USERS }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
        run: |
          if [ -n "$GITHUB_OAUTH_CLIENT_ID$GITHUB_OAUTH_CLIENT_SECRET$ADMIN_GITHUB_USERS$ADMIN_SESSION_SECRET" ]; then
            if [ -z "$GITHUB_OAUTH_CLIENT_ID" ] || [ -z "$GITHUB_OAUTH_CLIENT_SECRET" ] || [ -z "$ADMIN_GITHUB_USERS" ] || [ "${#ADMIN_SESSION_SECRET}" -lt 32 ]; then
              echo "::warning::Admin GitHub sign-in is only partly configured (all of GITHUB_OAUTH_CLIENT_ID, GITHUB_OAUTH_CLIENT_SECRET, ADMIN_GITHUB_USERS and a 32+ character ADMIN_SESSION_SECRET are needed); sign-in will stay disabled"
            fi
          fi

      - name: Deploy and restart services
        uses: appleboy/ssh-action@v1.0.0
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets['SERVER_HOST'] }}
          username: ${{ secrets['SERVER_USER'] }}
          key: ${{ secrets['SSH_PRIVATE_KEY'] }}
          envs: GITHUB_SHA,GITHUB_ACTOR
          script: |
            set -e
            echo "==> Deploy: creating directories"
            STAGING_DIR="$HOME/deploy/murphys-laws"
            TARGET_DIR="/root/murphys-laws"

            sudo install -d -m 755 "$STAGING_DIR"
            sudo install -d -m 755 "$TARGET_DIR"

            sudo install -d -m 755 "$TARGET_DIR/web"
            sudo install -d -m 755 "$TARGET_DIR/web/dist"
            sudo install -d -m 755 "$TARGET_DIR/backend"
            sudo install -d -m 755 "$TARGET_DIR/backend/src"
            sudo install -d -m 755 "$TARGET_DIR/backend/scripts"
            sudo install -d -m 755 "$TARGET_DIR/backend/db"
            sudo install -d -m 755 "$TARGET_DIR/backend/config"
            sudo install -d -m 755 "$TARGET_DIR/backend/logs"
            sudo install -d -m 755 "$TARGET_DIR/shared"
            sudo install -d -m 755 "$TARGET_DIR/shared/modules"

            sudo install -d -m 755 /etc/murphys-laws
            if [ -f "$TARGET_DIR/backend/config/infrastructure-inventory.json" ] && [ ! -f /etc/murphys-laws/infrastructure-inventory.json ]; then
              sudo cp "$TARGET_DIR/backend/config/infrastructure-inventory.json" /etc/murphys-laws/infrastructure-inventory.json
              sudo chmod 644 /etc/murphys-laws/infrastructure-inventory.json
            fi

            # The monitoring scripts below are installed with failures not ignored, so make sure they all
            # arrived before the live site is touched; failing later would leave a half-applied release.
            for script in alert-email health-monitor ssl-monitor cost-optimization-report test-backup-restore; do
              [ -f "$STAGING_DIR/backend/scripts/$script.sh" ] \
                || { echo "ERROR: $script.sh is missing from the uploaded release; nothing was changed on the server" >&2; exit 1; }
            done

            sudo rsync -a --delete "$STAGING_DIR/web/dist/" "$TARGET_DIR/web/dist/"
            sudo rsync -a --delete "$STAGING_DIR/backend/src/" "$TARGET_DIR/backend/src/"
            sudo rsync -a --delete "$STAGING_DIR/backend/scripts/" "$TARGET_DIR/backend/scripts/"
            sudo rsync -a --delete "$STAGING_DIR/backend/db/" "$TARGET_DIR/backend/db/"
            sudo rsync -a --delete "$STAGING_DIR/backend/config/" "$TARGET_DIR/backend/config/"
            sudo rsync -a --delete "$STAGING_DIR/shared/modules/" "$TARGET_DIR/shared/modules/"

            sudo install -m 644 "$STAGING_DIR/backend/ecosystem.config.cjs" "$TARGET_DIR/backend/ecosystem.config.cjs"
            sudo install -m 644 "$STAGING_DIR/nginx.conf" "$TARGET_DIR/nginx.conf"
            sudo install -m 644 "$STAGING_DIR/.nvmrc" "$TARGET_DIR/.nvmrc"
            sudo install -m 644 "$STAGING_DIR/backend/package.json" "$TARGET_DIR/backend/package.json"
            sudo install -m 644 "$STAGING_DIR/backend/package-lock.json" "$TARGET_DIR/backend/package-lock.json"
            sudo install -m 644 "$STAGING_DIR/web/vite.config.js" "$TARGET_DIR/web/vite.config.js"

            sudo chown -R root:root "$TARGET_DIR"

            echo "==> Deploy: testing nginx and reloading"
            sudo cp "$TARGET_DIR/nginx.conf" /etc/nginx/sites-available/murphys-laws
            sudo nginx -t && sudo systemctl reload nginx

            sudo --preserve-env=GITHUB_SHA,GITHUB_ACTOR bash <<'INNER'
            set -e
            trap 'echo "==> Script failed at line $LINENO"' ERR
            TARGET_DIR="/root/murphys-laws"

            echo "==> Loading nvm and checking Node"
            export NVM_DIR="/root/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd "$TARGET_DIR"
            if [ ! -f .nvmrc ]; then
              echo "ERROR: Missing $TARGET_DIR/.nvmrc"
              exit 1
            fi
            nvm install
            nvm use
            if ! command -v pm2 > /dev/null; then
              npm install --global pm2
            fi

            # Verify Node version matches .nvmrc
            ACTUAL_NODE_VERSION=$(node --version)
            EXPECTED_NODE_VERSION=$(tr -d '[:space:]' < "$TARGET_DIR/.nvmrc")
            case "$ACTUAL_NODE_VERSION" in
              "v$EXPECTED_NODE_VERSION"|"v$EXPECTED_NODE_VERSION".*) ;;
              *)
              echo "ERROR: Node version mismatch!"
              echo "Expected (from .nvmrc): $EXPECTED_NODE_VERSION"
              echo "Actual: $ACTUAL_NODE_VERSION"
              exit 1
              ;;
            esac
            echo "✓ Node version verified: $ACTUAL_NODE_VERSION"

            # Clean up old root-level files from pre-monorepo structure
            rm -f package.json ecosystem.config.cjs .env 2>/dev/null || true
            rm -rf config modules scripts utils logs 2>/dev/null || true

            cd "$TARGET_DIR/backend"

            # Backup production database before migrations
            cp murphys.db murphys.db.backup 2>/dev/null || true

            # Create .env file with secrets (delimiter chosen to avoid secrets breaking heredoc)
            cat > .env << '__ENV_END__'
            HOST=127.0.0.1
            PORT=8787
            NODE_ENV=production
            SMTP_HOST=${{ secrets['SMTP_HOST'] }}
            SMTP_PORT=${{ secrets['SMTP_PORT'] }}
            SMTP_USER=${{ secrets['SMTP_USER'] }}
            SMTP_PASS=${{ secrets['SMTP_PASS'] }}
            EMAIL_FROM=${{ secrets['EMAIL_FROM'] }}
            EMAIL_TO=${{ secrets['EMAIL_TO'] }}
            ALERT_EMAIL=${{ secrets['ALERT_EMAIL'] }}
            HEALTH_CHECK_EMAIL_TO=${{ secrets['HEALTH_CHECK_EMAIL_TO'] }}
            ALLOWED_ORIGINS=${{ secrets['ALLOWED_ORIGINS'] }}
            SENTRY_DSN=${{ secrets['SENTRY_DSN'] }}
            ADMIN_API_TOKEN=${{ secrets['ADMIN_API_TOKEN'] }}
            GITHUB_OAUTH_CLIENT_ID=${{ secrets['ADMIN_GITHUB_OAUTH_CLIENT_ID'] }}
            GITHUB_OAUTH_CLIENT_SECRET=${{ secrets['ADMIN_GITHUB_OAUTH_CLIENT_SECRET'] }}
            ADMIN_GITHUB_USERS=${{ secrets['ADMIN_GITHUB_USERS'] }}
            ADMIN_SESSION_SECRET=${{ secrets['ADMIN_SESSION_SECRET'] }}
            __ENV_END__

            # The optional recipients are left out when unset instead of being written as empty values
            sed -i -e '/^ALERT_EMAIL=$/d' -e '/^HEALTH_CHECK_EMAIL_TO=$/d' .env

            echo "==> Contents of $TARGET_DIR/backend:"
            ls -la

            if [ ! -f package.json ]; then
              echo "package.json missing in $TARGET_DIR/backend" >&2
              exit 1
            fi

            echo "==> Installing locked backend dependencies"
            npm ci

            echo "==> Running migrations"
            npm run migrate

            # Update server maintenance scripts
            sudo cp "$TARGET_DIR/backend/scripts/backup-murphys.sh" /usr/local/bin/backup-murphys.sh 2>/dev/null || true
            # Sourced by the monitoring scripts below to resolve the alert address. They fall back to the repo
            # copy, but the installed one is preferred, so a failure here fails the deploy instead of being
            # ignored
            sudo cp "$TARGET_DIR/backend/scripts/alert-email.sh" /usr/local/bin/alert-email.sh \
              && sudo chmod +x /usr/local/bin/alert-email.sh \
              && test -f /usr/local/bin/alert-email.sh \
              || { echo "ERROR: could not install /usr/local/bin/alert-email.sh; the monitoring scripts would lose their alerts" >&2; exit 1; }
            # These scripts also load that helper, so a copy that fails would leave an old script running with
            # the old behavior. Fail the deploy and show the cause instead of hiding it. (The other copies
            # below do not load the helper and keep ignoring errors.)
            for script in health-monitor ssl-monitor cost-optimization-report test-backup-restore; do
              sudo cp "$TARGET_DIR/backend/scripts/$script.sh" "/usr/local/bin/$script.sh" \
                && sudo chmod +x "/usr/local/bin/$script.sh" \
                || { echo "ERROR: could not install /usr/local/bin/$script.sh" >&2; exit 1; }
            done
            sudo cp "$TARGET_DIR/backend/scripts/daily-report.sh" /usr/local/bin/daily-report.sh 2>/dev/null || true
            sudo cp "$TARGET_DIR/backend/scripts/vulnerability-scanner.sh" /usr/local/bin/vulnerability-scanner.sh 2>/dev/null || true
            sudo cp "$TARGET_DIR/backend/scripts/performance-tracker.sh" /usr/local/bin/performance-tracker.sh 2>/dev/null || true
            sudo cp "$TARGET_DIR/backend/scripts/analyze-resource-peaks.sh" /usr/local/bin/analyze-resource-peaks.sh 2>/dev/null || true
            sudo mkdir -p /etc/murphys-laws
            sudo cp "$TARGET_DIR/backend/config/operational-metrics-main-app.env.example" /etc/murphys-laws/operational-metrics.env.example 2>/dev/null || true
            sudo cp "$TARGET_DIR/backend/config/infrastructure-inventory.json.example" /etc/murphys-laws/infrastructure-inventory.json.example 2>/dev/null || true
            sudo cp "$TARGET_DIR/backend/scripts/log-analyzer.sh" /usr/local/bin/log-analyzer.sh 2>/dev/null || true
            sudo chmod +x /usr/local/bin/*.sh 2>/dev/null || true

            # Disable standalone vulnerability scanner cron job (it's included in daily report)
            echo "Disabling standalone vulnerability scanner cron job..."
            sudo crontab -l | grep -v "vulnerability-scanner.sh" | sudo crontab - || true
            echo "✓ Standalone vulnerability scanner cron job disabled"

            echo "==> Restarting PM2"
            cd "$TARGET_DIR/backend"
            pm2 delete all || true
            # PM2 restores its saved process list during an update. Synchronize
            # only after deleting the API so it cannot restart against files that
            # are newer than the installed dependencies or database schema.
            pm2 update
            pm2 start ecosystem.config.cjs
            pm2 save

            # Verify PM2 is using Node.js 22.x without pinning to one patch version
            PM2_INTERPRETER=$(pm2 jlist | jq -r '.[] | select(.name=="murphys-api") | .pm2_env.exec_interpreter')
            if [[ -z "$PM2_INTERPRETER" || "$PM2_INTERPRETER" == "null" ]]; then
              echo "ERROR: Could not determine PM2 interpreter for murphys-api"
              pm2 list
              exit 1
            fi

            if [[ "$PM2_INTERPRETER" == "node" ]]; then
              PM2_NODE_VERSION=$(node --version)
            else
              PM2_NODE_VERSION=$("$PM2_INTERPRETER" --version 2>/dev/null || true)
            fi

            if [[ ! "$PM2_NODE_VERSION" =~ ^v22\. ]]; then
              echo "ERROR: PM2 is not using Node 22.x!"
              echo "Expected: v22.x"
              echo "Interpreter: $PM2_INTERPRETER"
              echo "Actual version: ${PM2_NODE_VERSION:-unknown}"
              pm2 logs --lines 50 --nostream
              exit 1
            fi
            echo "✓ PM2 interpreter verified: $PM2_INTERPRETER ($PM2_NODE_VERSION)"

            # Wait for services to start
            sleep 5

            # Verify PM2 processes are healthy
            echo "Checking PM2 process status..."
            pm2 list

            # Check for any error logs
            echo "Checking for errors in PM2 logs..."
            if pm2 logs murphys-api --lines 20 --nostream | grep -i "error\|module.*version"; then
              echo "⚠️  WARNING: Errors detected in logs"
            fi

            echo "==> Health check: testing API endpoints"
            if ! npx tsx scripts/wait-for-health-check.ts \
              "Law of the day endpoint" \
              "http://127.0.0.1:8787/api/v1/law-of-day"; then
              echo "ERROR: API health check failed after deployment!"
              echo "PM2 Status:"
              pm2 list
              echo "Recent logs:"
              pm2 logs --lines 50 --nostream
              exit 1
            fi

            # Test additional endpoints
            if ! npx tsx scripts/wait-for-health-check.ts \
              "Laws endpoint" \
              "http://127.0.0.1:8787/api/v1/laws?limit=1"; then
              echo "ERROR: Laws endpoint health check failed!"
              pm2 logs --lines 50 --nostream
              exit 1
            fi

            echo "✅ Deployment successful - API is healthy"
            echo "✅ All health checks passed"
            INNER

      - name: Detect daily email renderer changes
        id: daily_email_template
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No prior SHA on push; will attempt template smoke email if configured."
            exit 0
          fi
          if git diff --name-only "$BEFORE" "$AFTER" | grep -qx 'backend/scripts/render-daily-report.ts'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send daily email template smoke test
        if: steps.daily_email_template.outputs.changed == 'true'
        uses: appleboy/ssh-action@v1.0.0
        env:
          DAILY_REPORT_TEST_RECIPIENT: ${{ secrets['DAILY_REPORT_TEST_RECIPIENT'] }}
        with:
          host: ${{ secrets['SERVER_HOST'] }}
          username: ${{ secrets['SERVER_USER'] }}
          key: ${{ secrets['SSH_PRIVATE_KEY'] }}
          envs: DAILY_REPORT_TEST_RECIPIENT
          script: |
            if [ -z "${DAILY_REPORT_TEST_RECIPIENT:-}" ]; then
              echo "DAILY_REPORT_TEST_RECIPIENT secret not set; skipping template smoke email."
              exit 0
            fi
            sudo DAILY_REPORT_TEST_RECIPIENT="$DAILY_REPORT_TEST_RECIPIENT" \
              REPO_ROOT=/root/murphys-laws \
              /usr/local/bin/daily-report.sh --test-email

      - name: Smoke test production routes
        run: npm run smoke:production
