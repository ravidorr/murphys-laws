name: iOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'ios/**'
      - 'shared/DESIGN.md'
      - 'shared/design-tokens/**'
      - 'web/DESIGN.md'
      - 'web/styles/partials/variables.css'
      - '.github/workflows/ios-ci.yml'
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            relevant:
              - 'ios/**'
              - 'shared/DESIGN.md'
              - 'shared/design-tokens/**'
              - 'web/DESIGN.md'
              - 'web/styles/partials/variables.css'
              - '.github/workflows/ios-ci.yml'
  build-and-test:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies (root - npm workspaces)
        run: npm ci

      - name: Check design-system conformance
        run: npm run design:conformance

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      # Tokens.swift and Assets.xcassets/DS/ are gitignored; regenerate them
      # from the authoritative design system so the Swift compiler can resolve
      # `DS.Color.*` and `DS.Typography.*` references.
      - name: Regenerate iOS design tokens
        run: npm run design:export:ios

      - name: Install XcodeGen
        run: brew install xcodegen

      # The committed MurphysLaws.xcodeproj/project.pbxproj is stale w.r.t.
      # the freshly-regenerated DesignSystem/Tokens.swift (and any other
      # source rearrangement since the project was last opened in Xcode).
      # XcodeGen rebuilds it from project.yml so xcodebuild sees the
      # current file tree.
      - name: Regenerate Xcode project
        run: cd ios && xcodegen generate

      - name: Select iOS simulator
        run: |
          SIMULATOR_ID="$(xcrun simctl list devices available | awk '/iPhone/ {
            for (i = 1; i <= NF; i++) {
              if ($i ~ /^\([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}\)$/) {
                gsub(/[()]/, "", $i)
                print $i
                exit
              }
            }
          }')"
          if [ -z "$SIMULATOR_ID" ]; then
            echo "No available iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi
          echo "IOS_SIMULATOR_DESTINATION=platform=iOS Simulator,id=$SIMULATOR_ID" >> "$GITHUB_ENV"

      - name: Build
        run: |
          cd ios
          xcodebuild build \
            -project MurphysLaws.xcodeproj \
            -scheme MurphysLaws \
            -destination 'generic/platform=iOS Simulator'

      - name: Test and enforce coverage
        run: |
          cd ios
          ./scripts/test-coverage.sh "$IOS_SIMULATOR_DESTINATION"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-coverage
          path: |
            ios/coverage.json
            ios/TestResults.xcresult
          if-no-files-found: error
          retention-days: 7

  ci-gate:
    name: ios-ci-gate
    needs: [changes, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify applicable CI completed successfully
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          BUILD_AND_TEST_RESULT: ${{ needs.build-and-test.result }}
        run: |
          if [ "$CHANGES_RESULT" = "success" ] && [ "$RELEVANT" = "false" ]; then
            echo "No relevant changes; mobile CI is not required."
            exit 0
          fi
          if [ "$BUILD_AND_TEST_RESULT" = "success" ]; then
            echo "Applicable mobile CI completed successfully."
            exit 0
          fi
          echo "Applicable mobile CI finished with result: $BUILD_AND_TEST_RESULT"
          exit 1
