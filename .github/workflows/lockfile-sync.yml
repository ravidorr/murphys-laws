name: Lockfile sync

# Fails a pull request when a package.json version disagrees with the lockfiles that record it. It runs on
# every pull request (no path filter) so it can be a required status check. The pre-commit and pre-push hooks
# run the same check locally, but hooks can be skipped, so this is the one that cannot.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: lockfile-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check package.json versions against every lockfile entry
        run: npm run check:lockfiles

      - name: Test the version and lockfile checks
        run: node --import tsx --test scripts/check-version-bumps.test.ts

      # npm itself is the authority for the root lockfile: regenerating it must change nothing. This is not
      # done for backend/package-lock.json because npm 10 (bundled with this Node) and npm 11 write it
      # differently (libc fields), so the exact-version comparison above covers that file.
      - name: Regenerating the root lockfile changes nothing
        run: |
          npm install --package-lock-only --ignore-scripts
          git diff --exit-code -- package-lock.json
