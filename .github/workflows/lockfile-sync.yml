name: Lockfile sync

# Fails a pull request when a lockfile records a different version than the package.json it belongs to. The
# pre-commit hook fixes this automatically (npm run lockfiles:sync), but hooks can be skipped, so this is the
# check that cannot be. It runs on every pull request (no path filter) so it can be a required status check.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: lockfile-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lockfile-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lockfile versions match package.json
        run: npm run lockfiles:sync -- --check

      - name: Test the lockfile sync script
        run: node --import tsx --test scripts/sync-lockfile-versions.test.ts
