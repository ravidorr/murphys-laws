name: npm ci with retries
description: >-
  Run npm ci, retrying up to three times. Installing the root workspaces builds native add-ons
  such as canvas, which download a prebuilt binary from GitHub Releases; when that download
  fails the install falls back to a compile that the runner cannot do, and the whole job fails
  for a reason that has nothing to do with the change under test.

inputs:
  args:
    description: Extra arguments for npm ci, for example "--prefix backend".
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: npm ci
      shell: bash
      env:
        NPM_CI_ARGS: ${{ inputs.args }}
      run: |
        for attempt in 1 2 3; do
          # The arguments are word-split on purpose: they come from the workflow file, not from users.
          # shellcheck disable=SC2086
          if npm ci $NPM_CI_ARGS; then
            exit 0
          fi
          echo "::warning::npm ci failed (attempt ${attempt} of 3)"
          sleep $((attempt * 20))
        done
        echo "::error::npm ci failed three times"
        exit 1
