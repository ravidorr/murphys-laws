    # Some browsers and link tools ask for /favicon without the extension.
    location = /favicon {
        return 301 https://murphys-laws.com/favicon.ico;
    }

    # Older copies of our structured data pointed the logo at /favicon-512x512.png, which was never published.
    location = /favicon-512x512.png {
        return 301 https://murphys-laws.com/android-chrome-512x512.png;
    }

    # /law is the parent of every /law/N URL (visitors and crawlers trim the id off a law link, and Tor exits and
    # Googlebot asked for it); Browse is the law list, and the Home > Browse > Category > Law breadcrumb puts it there.
    # /law/ reaches this block in two hops: the trailing-slash rewrite above, then this redirect.
    location = /law {
        return 301 https://murphys-laws.com/browse;
    }

    # Meta's crawlers (meta-externalagent, meta-webindexer) ask for /null and /law/null a few times a day from law pages
    # and /favorites. No rendered link points there (checked on the live pages), so the likely source is a null URL value
    # in page script or data that the crawler turns into a relative link. Sent home instead of a 404; not blocked, because
    # a ban would hit a legitimate crawler.
    location = /null {
        return 301 https://murphys-laws.com/;
    }
    location = /law/null {
        return 301 https://murphys-laws.com/;
    }

    # RFC 9116 allows /security.txt as a fallback for /.well-known/security.txt; crawlers still ask for it.
    location = /security.txt {
        return 301 https://murphys-laws.com/.well-known/security.txt;
    }

    # Crawlers (a bug-bounty collector among them) also ask for a bare /security; send them to the same file.
    # /security/ reaches this block in two hops, through the trailing-slash rewrite above.
    location = /security {
        return 301 https://murphys-laws.com/.well-known/security.txt;
    }

    # Crawlers guess these two names: Bing asks for /sitemaps.xml and some bots for /favicon.png.
    location = /sitemaps.xml {
        return 301 https://murphys-laws.com/sitemap.xml;
    }
    # API tools and crawlers guess /swagger.json for the OpenAPI document; the site publishes it as /openapi.json.
    location = /swagger.json {
        return 301 https://murphys-laws.com/openapi.json;
    }
    # Sitemap-index names that WordPress and SEO plugins use; this site has one flat sitemap.
    location = /sitemap_index.xml {
        return 301 https://murphys-laws.com/sitemap.xml;
    }
    location = /sitemap-index.xml {
        return 301 https://murphys-laws.com/sitemap.xml;
    }
    location = /favicon.png {
        return 301 https://murphys-laws.com/favicon-32x32.png;
    }

    # llms.txt lists /browse and /categories as markdown links, [Browse all laws](https://murphys-laws.com/browse), and
    # naive crawlers keep the closing ")" as part of the URL. A ")" is an ordinary character in a location.
    location = /browse) {
        return 301 https://murphys-laws.com/browse;
    }
    location = /categories) {
        return 301 https://murphys-laws.com/categories;
    }

    # FeedBurner still polls the feed under a path from the old site (/rss/murphys-laws.rss); the feed is /api/v1/feed.rss.
    location = /rss/murphys-laws.rss {
        return 301 https://murphys-laws.com/api/v1/feed.rss;
    }

    # /rss.xml is the conventional feed path that readers and crawlers guess; send it to the real feed too.
    location = /rss.xml {
        return 301 https://murphys-laws.com/api/v1/feed.rss;
    }

    # /feed is the other conventional feed path; it fell through to the SPA and returned the HTML shell, which a feed reader cannot parse.
    location = /feed {
        return 301 https://murphys-laws.com/api/v1/feed.rss;
    }

    # /sitemap.gz was submitted to Search Console in 2006 and is still requested; send it to the real sitemap.
    location = /sitemap.gz {
        return 301 https://murphys-laws.com/sitemap.xml;
    }

    # Google's prefetch proxy asks for this file; answer instead of logging a 404.
    location = /.well-known/traffic-advice {
        default_type application/trafficadvice+json;
        return 200 '[{"user_agent":"prefetch-proxy","google_prefetch_proxy_eap":{"fraction":1.0}}]';
    }

    # RFC 9116 security contact, mirroring SECURITY.md. Expires must be renewed before it passes.
    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
        return 200 "Contact: https://github.com/ravidorr/murphys-laws/security/advisories/new\nExpires: 2027-11-06T00:00:00.000Z\nPolicy: https://github.com/ravidorr/murphys-laws/blob/main/SECURITY.md\nCanonical: https://murphys-laws.com/.well-known/security.txt\n";
    }

    # TDM Reservation Protocol: robots.txt already welcomes AI crawlers, so say the same
    # in machine-readable form (tdm-reservation 0 = text and data mining is not reserved).
    location = /.well-known/tdmrep.json {
        default_type application/json;
        return 200 '[{"location":"/*","tdm-reservation":0}]';
    }

    # Category slugs were corrected in the API. Preserve their search equity
    # and avoid serving the SPA's misleading empty-category state.
    location = /category/murphys-cars-4x4-laws {
        return 301 https://murphys-laws.com/category/murphys-4x4-car-laws$is_args$args;
    }
    location = /category/murphys-cars-open-road-laws {
        return 301 https://murphys-laws.com/category/murphys-law-of-the-open-road$is_args$args;
    }
    location = /category/murphys-computers-laws {
        return 301 https://murphys-laws.com/category/murphys-computer-laws$is_args$args;
    }
    location = /category/murphys-cowboy-action-shooting-laws {
        return 301 https://murphys-laws.com/category/murphys-cowboy-action-shooting-cas-laws$is_args$args;
    }
    location = /category/murphys-helicopters-war-laws {
        return 301 https://murphys-laws.com/category/murphys-helicopters-warfare-laws$is_args$args;
    }
    location = /category/murphys-marine-corp-laws {
        return 301 https://murphys-laws.com/category/murphys-marine-corps-laws$is_args$args;
    }
    location = /category/murphys-mechanics-laws {
        return 301 https://murphys-laws.com/category/murphys-laws-of-mechanics$is_args$args;
    }
    location = /category/murphys-repairmen-laws {
        return 301 https://murphys-laws.com/category/murphys-repairmans-laws$is_args$args;
    }
    location = /category/murphys-tanks-war-laws {
        return 301 https://murphys-laws.com/category/murphys-tank-warfare-laws$is_args$args;
    }

    # Preserve direct visits to calculator routes kept by the client router.
    location = /calculator {
        return 301 https://murphys-laws.com/calculator/sods-law$is_args$args;
    }
    location = /toastcalculator {
        return 301 https://murphys-laws.com/calculator/buttered-toast$is_args$args;
    }

    # Pre-rendered routes are preferred, but new laws and categories can be
    # published after the last SSG build. Let the API render only those known
    # dynamic route patterns; unrelated paths still reach the static 404.
    location ~ ^/law/\d+$ {
        try_files $uri/index.html @law-detail;
    }
    location ~ ^/category/[^/]+$ {
        try_files $uri/index.html @category-detail;
    }

    # Embeddable law cards. The backend renders them (they are never prerendered) and they must stay
    # framable, so no X-Frame-Options or frame-ancestors header is sent here.
    location ~ ^/embed/(law/\d+|law-of-day)/?$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Daily email confirm and unsubscribe pages (the emails link here); the backend renders them.
    location ~ ^/subscription/(confirm|unsubscribe)/?$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin moderation page. The backend serves it (and 404s unless ADMIN_API_TOKEN or the GitHub sign-in
    # is configured); its assets load from /api/v1/admin/ui/*, covered by /api below.
    # The trailing-slash rewrite above sends /admin/ to /admin.
    location = /admin {
        proxy_pass http://127.0.0.1:8787;
        # A disabled admin page (404) must look like any other missing page.
        proxy_intercept_errors on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Serve the pre-rendered route without redirecting to its directory URL.
        # Unknown routes must return a real 404, not an indexable SPA soft-404.
        try_files $uri/index.html $uri =404;
        
        # Hashed build output: Vite puts an 8-character content hash in every file name under /assets/
        # (index-DZClfRb6.js, style-BhqpAbOy.css), so a URL never changes content and can be cached for good.
        # npm run build writes a gzip and a brotli copy next to each .js, .css and .svg file among them
        # (web/scripts/precompress-assets.ts). brotli_static serves the .br copy to clients that accept br and
        # gzip_static the .gz copy to the ones that only accept gzip, so nothing is compressed at request time.
        # Both take the type of a file from its original, and gzip_vary above adds Vary: Accept-Encoding to both.
        # A single Cache-Control header: expires would add a second one next to add_header. add_header in a
        # location replaces any inherited one, and none is set above this block. This regex location comes first
        # so it wins over the script, stylesheet and image rules below. The pattern is quoted because nginx reads an unquoted { as a block.
        location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.(js|css|png|jpe?g|gif|ico|svg|webp|woff2?)$" {
            gzip_static on;
            brotli_static on;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Scripts and styles without a content hash: the service worker (/sw.js), /offline.js and the files under
        # /styles/ (variables.css is regenerated by every build). The same URL gets new content whenever the file
        # changes (always for /sw.js), so a one-year lifetime could leave visitors, and the service worker's own precache (Cache.addAll reads
        # through the HTTP cache), on old copies of /offline.js and the stylesheets. Browsers already skip the HTTP
        # cache when they check /sw.js itself, so for that file this is consistency, not the fix. no-cache means
        # "store, but revalidate before use": the ETag and Last-Modified nginx sends keep that to a 304 with no
        # body. A single add_header, no expires (a second Cache-Control header would sit next to it). This
        # location comes after the hashed one (which owns /assets/), so hashed files never reach it, and a script
        # or stylesheet added later without a hash is safe by default.
        location ~* \.(js|css)$ {
            add_header Cache-Control "no-cache";
        }

        # Files that a crawler or the browser re-reads and that change without a new name: the web app manifest,
        # robots.txt and the sitemaps. They never had the one-year rule (they sent no Cache-Control at all, so
        # browsers fell back to heuristic freshness); no-cache makes a change visible on the next request. Other
        # text files and the pages themselves are left alone and still send no Cache-Control.
        # default_type is the fallback for a name /etc/nginx/mime.types does not map. nginx 1.24 has no entry for
        # .webmanifest, so the manifest went out as application/octet-stream and a browser downloaded it instead of
        # showing it (Chrome then flagged that download as insecure when it started on http://). robots.txt and the
        # sitemaps are mapped (text/plain, text/xml) and never reach the fallback. Not a location-level `types { ... webmanifest; }`:
        # that would replace the whole inherited map, so robots.txt and the sitemaps would lose their mappings.
        location ~* "^/(manifest\.webmanifest|robots\.txt|sitemap\.xml|image-sitemap\.xml)$" {
            default_type application/manifest+json;
            add_header Cache-Control "no-cache";
        }

        # Cache control for the images. Images rarely change and are not content-hashed, so a one-year lifetime
        # without "immutable"; a changed image can stay stale in browsers for a long time.
        location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }

    location @law-detail {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }

    location @category-detail {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }

    # A client that sends plain HTTP to this TLS port is a scanner: browsers never do. nginx raises
    # error 497 and would answer "400 The plain HTTP request was sent to HTTPS port", which lands in
    # the main access log and the daily report. Drop it without a response like the other scanner
    # hits and log it to scanner.log. The "=444" makes the log line say 444 (without it nginx logs
    # 400), which is what the fail2ban filter counts as a strike.
    error_page 497 =444 @plain_http_on_tls;
    location @plain_http_on_tls {
        access_log /var/log/nginx/scanner.log combined;
        return 444;
    }

    # Custom 404 page
    error_page 404 410 /404.html;
    location = /404.html {
        internal;
    }

    # OG Images - dynamic images for social sharing
    # These are generated on-demand by the backend and should be cached
    location ~ ^/api/v1/og/law/\d+\.png$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache OG images for 1 day at nginx level
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        
        # Add cache headers for downstream caches and browsers
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API - proxies to Node.js API server
    location /api {
        # Googlebot's robots.txt group does not disallow /api/ (the pages fetch their data from it while
        # rendering), so it crawls the JSON endpoints as pages and reports them as "crawled, not indexed".
        # Keep them out of the index without blocking the fetch. This applies to every crawler, including
        # the AI crawlers whose robots.txt groups allow /api/: they can still fetch, only search engines
        # skip indexing. The OG image location above has its own headers.
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTTP/2 is off on purpose until nginx is patched for CVE-2026-123007 and CVE-2026-123633: no http2 parameter on any listen.
    # The TODO.md Security item says when and how to turn it back on.
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/murphys-laws.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/murphys-laws.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Canonical host redirect.
server {
    listen 443 ssl;
    server_name www.murphys-laws.com;

    if ($block_request) {
        return 444;
    }
    access_log /var/log/nginx/access.log combined if=$log_normal;
    access_log /var/log/nginx/access_timed.log timed if=$log_normal;
    access_log /var/log/nginx/scanner.log combined if=$block_request;

    ssl_certificate /etc/letsencrypt/live/murphys-laws.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/murphys-laws.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # A client that sends plain HTTP to this TLS port is a scanner: browsers never do. nginx raises
    # error 497 and would answer "400 The plain HTTP request was sent to HTTPS port", which lands in
    # the main access log and the daily report. Drop it without a response like the other scanner
    # hits and log it to scanner.log. The "=444" makes the log line say 444 (without it nginx logs
    # 400), which is what the fail2ban filter counts as a strike.
    error_page 497 =444 @plain_http_on_tls;
    location @plain_http_on_tls {
        access_log /var/log/nginx/scanner.log combined;
        return 444;
    }

    return 301 https://murphys-laws.com$request_uri;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name murphys-laws.com www.murphys-laws.com;

    if ($block_request) {
        return 444;
    }
    access_log /var/log/nginx/access.log combined if=$log_normal;
    access_log /var/log/nginx/access_timed.log timed if=$log_normal;
    access_log /var/log/nginx/scanner.log combined if=$block_request;

    return 301 https://murphys-laws.com$request_uri;
}
