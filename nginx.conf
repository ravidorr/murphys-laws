# Nginx configuration for Murphy's Laws
# Copy this to /etc/nginx/sites-available/murphys-laws on the droplet
#
# This configuration serves pre-built static files from the dist directory.
# The deployment process builds locally and syncs dist/ to the server.
# No Vite preview server is used in production.

# Scanner defense. This file is installed in sites-available, which nginx
# includes inside the http block, so these top-level maps are http-context.

# Exploit-kit and scanner user agents (seen in the logs: libredtail-http, Nmap Scripting Engine, wp2shell-rce,
# pathscan/1.0 and ffuf's "Fuzz Faster U Fool", written with \s because the key is unquoted).
map $http_user_agent $scanner_agent {
    default 0;
    ~*(libredtail|masscan|zgrab|nikto|sqlmap|nuclei|rawgrab|nmap|wp2shell|pathscan|fuzz\sfaster\su\sfool) 1;
}

# Paths no visitor of this site requests: dotfiles with secrets, source control,
# cloud credentials, CMS/PHP/Java/Oracle exploit paths, config and backup files.
# Patterns are anchored to the path (^[^?]*) so a search such as /browse?q=error.log is never blocked.
map $request_uri $scanner_path {
    default 0;
    # Any dot-directory or dotfile (.env*, .git, .aws, .config, .htaccess, ...) except .well-known.
    "~*^[^?]*(^|/)\.(?!well-known(/|$))" 1;
    # Percent-encoded evasion: an encoded dot or percent in the path, or three
    # or more encoded printable characters in a row (%65%6e%76 for "env").
    "~*^[^?]*%(25|2e)" 1;
    "~*^[^?]*(%[2-7][0-9a-f]){3}" 1;
    "~*^[^?]*(^|/)(wp|wp-admin|wp-login|wp-content|wp-includes|wp-json|xmlrpc|wordpress)([./?]|$)" 1;
    # The .gz pattern below skips exactly /sitemap.gz: it is redirected to /sitemap.xml (location = /sitemap.gz).
    # .tgz joins .tar and .gz for site-backup guesses (/html.tgz, /public_html.tgz, /backup.tgz).
    # The last five extensions are .NET trace handlers (elmah.axd, trace.axd), private keys and certificates
    # (key.pem, server.key), Postfix/ssmtp config (ssmtp.conf) and the Firebase iOS config (GoogleService-Info.plist).
    "~*^(?!/sitemap\.gz(\?|$))[^?]*\.(php|asp|aspx|jsp|cgi|sql|sqlite3?|db|bak|old|save|swp|orig|ini|log|tar|gz|tgz|zip|axd|pem|key|conf|plist)(\?|$)" 1;
    # _debugbar and _ignition are the Laravel debug bar and Ignition health-check probes.
    "~*^[^?]*(^|/)(phpunit|phpinfo|_profiler|_debugbar|_ignition|actuator|oa_html|cgi-bin|phpmyadmin|administrator)([/?]|$)" 1;
    "~*^[^?]*(^|/)vendor/phpunit" 1;
    "~*^[^?]*(^|/)owa/auth" 1;
    # Microsoft Exchange autodiscover and Exchange Web Services probes (this site runs no mail server).
    "~*^[^?]*(^|/)(autodiscover/autodiscover\.(xml|json)|ews/(exchange|services)\.asmx)([/?]|$)" 1;
    # Network-appliance and file-transfer exploit probes: SonicWall SonicOS and its SSL-VPN portal (/sonicui/7/sslvpn-portal),
    # CrushFTP and Microsoft Remote Desktop Web Access.
    "~*^[^?]*(^|/)(sonicos|sonicui|WebInterface|RDWeb)([/?]|$)" 1;
    # Static login-page guesses from the same SonicWall sweep (/sslvpnLogin.html, /auth.html, /auth1.html); the site has no such pages.
    "~*^/(sslvpnLogin|auth1?)\.html(\?|$)" 1;
    # The SSL-VPN portal's own scripts at the root (/sslvpn/js/login.js?q=000...) and the Atlassian Application Links
    # manifest (/rest/applinks/1.0/manifest, a Jira/Confluence probe; this site has no /rest API, the real one is /api/v1).
    # Root-anchored with a segment boundary, so /sslvpnx, /law/sslvpn and ?q=sslvpn pass.
    "~*^/(sslvpn|rest/applinks)(/|\?|$)" 1;
    # Cisco ASA/AnyConnect login probes (/+CSCOE+/logon.html, /+CSCOT+/oem-customization): no real URL starts with "/+".
    "~*^/\+CSCO[a-z]\+(/|\?|$)" 1;
    # Joomla component assets (/media/com_acym/..., /components/com_x/...) and Apache, Go expvar and Solr admin probes.
    "~*^[^?]*(^|/)(components|media)/com_[a-z0-9_]+(/|\?|$)" 1;
    "~*^/(server-status|server-info|debug/vars|solr)(/[^?]*)?(\?|$)" 1;
    # Stack and service fingerprinting at the root: Laravel Telescope, the Yii debug toolbar, Magento's app/etc/local.xml,
    # the nginx stub status page, Prometheus metrics, the Chrome DevTools /json/version listing, the D-Link HNAP1
    # router probe, Nmap's /nmaplowercheck (and the /evox/about the same run asked for) and DNS-over-HTTPS resolver
    # guesses (/dns-query, /doh, /resolve). The site serves none of them; exact names with the root anchor, so /api/v1/metrics would still pass.
    "~*^/(telescope(/[^?]*)?|debug/default/[^?]*|app/etc/local\.xml|nginx_status|metrics|json/(version|list)|HNAP1|nmaplowercheck[0-9]*|evox/about|dns-query|doh|resolve)/?(\?|$)" 1;
    "~*^[^?]*(^|/)storage/logs" 1;
    "~*^[^?]*(^|/)(application(-[a-z]+)?\.(ya?ml|properties)|appsettings(\.[a-z]+)?\.json)(\?|$)" 1;
    "~*^[^?]*(^|/)(serviceaccount|service-account|gcloud-service-key)\.json(\?|$)" 1;
    # Cloud and app credential files asked for at the root: Google service-account and OAuth client files, Firebase,
    # Vercel and AWS config (and the AWS IAM policy dump, iam.json), API key and token lists, and the PHP error log. Root-anchored (these names are generic).
    "~*^/(application_default_credentials|client_secret[^/?]*|firebase-adminsdk[^/?]*|serviceAccountKey|gcp-key|google-services|runtimeconfig|firebase|s3|aws|auth|env|now|parameters|iam)\.json(\?|$)" 1;
    "~*^/(aws\.ya?ml|api-keys\.txt|tokens\.txt|credentials\.csv|error_log)(\?|$)" 1;
    "~*^[^?]*(^|/)(aws-exports|env)\.js(\?|$)" 1;
    # A bare /env or /env.txt at the root (Spring Boot and "dump the environment" guesses); no route of this site is named env.
    "~*^/env(\.txt)?(\?|$)" 1;
    # The config pattern also takes the .example, .sample and .dist copies (/config.example.json from a credentials sweep);
    # manage.py (Django), constants.py and settings.py are in the build-file list below.
    "~*^[^?]*(^|/)(config|configuration|settings|secrets?|credentials|keys?)(\.(example|sample|dist))?\.(json|ya?ml|js|toml|xml|txt|php|py|rb)(\?|$)" 1;
    "~*^[^?]*(^|/)credentials(\?|$)" 1;
    "~*^[^?]*\.env(\?|$)" 1;
    "~*^[^?]*(^|/)(composer\.(lock|json)|package(-lock)?\.json|parameters\.ya?ml|settings\.py|manage\.py|constants\.py|wp-config[^/]*|containers/json)(\?|$)" 1;
    # Editor and infrastructure state files from a secrets sweep: the Sublime SFTP plugin config (sftp-config.json holds
    # host and password) and Terraform state, backup and variable files. This site publishes none of them.
    "~*^[^?]*(^|/)(sftp-config\.json|terraform\.(tfstate(\.backup)?|tfvars))(\?|$)" 1;
    # Ruby, Python, Jenkins and Expo project files from a build-file sweep: lock files, Django local settings,
    # Rails database config, the Jenkins pipeline and the Expo app config. This site publishes none of them.
    "~*^[^?]*(^|/)(Gemfile(\.lock)?|yarn\.lock|Jenkinsfile|Vagrantfile|app\.json|database\.ya?ml|local(_settings)?\.py|id_(rsa|dsa|ecdsa|ed25519)(\.pub)?)(\?|$)" 1;
    "~*^[^?]*(^|/)config/(aws|azure|gcp|database|secrets?|credentials|environment|master|email|mongoid|initializers)(\.|/|\?|$)" 1;
    "~*^[^?]*(^|/)latest/meta-data" 1;
    "~*^[^?]*(^|/)(docker-compose[^/]*\.ya?ml|Dockerfile[^/]*)(\?|$)" 1;
    "~*^[^?]*(^|/)(readme\.html|license\.txt)(\?|$)" 1;
    "~*(allow_url_include|auto_prepend_file)" 1;
    # Guessed-path sweeps for pages and endpoints this site does not have: signup and account forms,
    # generic company-site pages, and API/auth guesses. Anchored to the whole path, so a future page
    # with one of these names must be removed here (the test lists the real routes that must pass).
    "~*^/(account/(create|register)|auth/(signup|register)|users/(sign_in|sign_up)|create-account|email-signup|footer-signup|contact-form)/?(\?|$)" 1;
    "~*^/(company|eventmanager|leistungen|our-team|products|services|servicios|team|vpn)/?(\?|$)" 1;
    # /api/session/properties is the Metabase pre-auth setup-token probe (CVE-2023-38646); this API has no /api/session.
    # /v1/users is the same kind of root-level guess as /v1/auth/...; the real API lives under /api/v1, which this does not touch.
    "~*^/(api/usage/stats/?|api/session/properties/?|v1/(auth/[^?]*|users/?))(\?|$)" 1;
    # Wallet top-up guesses, Laravel/Vite build-manifest probes and IPFS gateway probes: no such routes here.
    "~*^/((wallet|ipfs)(/[^?]*)?|build/manifest\.json)(\?|$)" 1;
    # Jenkins CSRF-token discovery, AI-sandbox code-execution endpoints and stack fingerprinting
    # (/health, /health/... and /version at the root; this site's real health check is /api/health).
    "~*^/(crumbIssuer(/[^?]*)?|run/?|health(/[^?]*)?|version/?|(api/v1/)?code/blocks/exec/[a-z/]+)(\?|$)" 1;
    # Guessed login and status pages at the root (this site has no visitor login or status page; the admin sign-in is
    # /admin and the API), the FortiGate SSL-VPN login (/remote/login) and the control-panel login (/cp/login). Exact names, so /api/status or /law/login pass.
    "~*^/(login|status|remote/login|cp/login)/?(\?|$)" 1;
    # Appliance probes: the VMware vSphere version list (/sdk/vimServiceVersions.xml) and the MobileIron Sentry
    # configuration API (/mics/api/v2/sentry/...). The site serves nothing under either name.
    "~*^/(sdk/vimServiceVersions\.xml|mics/api/)" 1;
    # WordPress REST API probes through the query string at the root (/?rest_route=/batch/v1); the site has no WordPress.
    # rest_route may come after another parameter (/?a=1&rest_route=/wp/v2/users); a subpath such as /browse?rest_route= is left alone.
    "~*^/\?([^#]*&)?rest_route=" 1;
    # CMS fingerprinting sweeps for stacks this site does not run: Drupal (/node/1.json, /core/modules/..., /user/login),
    # Magento (/pub/static), Craft (/actions/users/...) and Joomla language files (/language/en-GB/en-GB.xml).
    "~*^/(node/[0-9]+(\.json)?|user/login)/?(\?|$)" 1;
    # /core/static/ (/core/static/css/standard-ui.css) is a generic CMS/framework asset guess: this site has no /core directory.
    "~*^/core/(modules|static)/" 1;
    "~*^/pub/static(/|\?|$)" 1;
    "~*^/actions/users(/|\?|$)" 1;
    "~*^/language/[a-z]{2}-[a-z]{2}/[^?]*\.xml(\?|$)" 1;
    # CKEditor (and its file manager) from a script-library sweep (/js/lib/ckeditor/ckeditor.js): an old editor with known
    # XSS and upload bugs. This site ships no editor; the segment boundary leaves /law/ckeditor-tips and ?q=ckeditor alone.
    "~*^[^?]*(^|/)ckeditor([/.]|\?|$)" 1;
    # VICIdial call-centre dialer probes (/vicidial, /agc, /RECORDINGS and /RECORDINGS/MP3 in one sweep): an open-source
    # dialer this site does not run. Root-anchored with a segment boundary, so /law/vicidial-tips and ?q=recordings still pass.
    "~*^/(vicidial|agc|recordings)(/[^?]*)?(\?|$)" 1;
    # Appliance, CMS and ERP fingerprinting from one sweep: Zabbix, Sitecore, Apache OFBiz (/partymgr), Microsoft Identity
    # Manager (/identity), Palo Alto GlobalProtect and JasperReports Server (/jasperserver, -pro, Test). The image-type
    # /zabbix/favicon.ico is a probe, not a missing image. Root-anchored with a segment boundary, so /identity-theft still passes.
    "~*^/(zabbix|sitecore|partymgr|identity|global-protect|jasperserver[a-z-]*)(/[^?]*)?(\?|$)" 1;
    # Login-page and version-file guesses from the same sweep: MikroTik WebFig, /webclient, /console, SugarCRM and
    # assorted appliance pages. Exact names (a trailing slash is allowed), so /law/console or ?q=console pass.
    "~*^/(webfig|webclient|console|login\.do|showLogin\.cc|internal_forms_authentication|Web/Auth|sugar_version\.json|js/NewWindow_2_all\.js|static/historypage\.js)/?(\?|$)" 1;
    # Embedded-device CGI login (/ssi.cgi/Login.htm): the .cgi extension rule only matches a path that ends in it.
    "~*^[^?]*(^|/)ssi\.cgi(/|\?|$)" 1;
    # The ffuf wordlist guess /api/hyper.Index/config, also under /hall/: no such API here.
    "~*^[^?]*(^|/)hyper\.Index/config/?(\?|$)" 1;
    # Vite and Nuxt dev-server file-read probes (/@fs/proc/self/environ?raw??, also under /_nuxt/, plus /@vite/client and
    # /@id/...): this site is static and no real URL has an "@" path segment.
    "~*^[^?]*(^|/)@(fs|vite|id)/" 1;
    # File-manager path-traversal probe (/userfiles/x?path=../../.env): the site serves nothing under /userfiles, and the
    # dotfile rule above only reads the path, not the query string.
    "~*^/userfiles(/|\?|$)" 1;
    # Guessed backup page (HEAD /backup from rotating cloud addresses with a forged self-referrer): no such page here.
    # Exact name with an optional s and slash, so /law/backup, /browse?q=backup and /backup-tips pass.
    "~*^/backups?/?(\?|$)" 1;
    # Crypto-wallet file guess (/wallet.dat, /Wallet.dat); the wallet-top-up rule above only takes /wallet and its subpaths.
    "~*^[^?]*(^|/)wallet\.dat(\?|$)" 1;
    # Chinese CMS script sweep from rotating Alibaba Cloud addresses (/Public/home/js/check.js and
    # /static/admin/javascript/hetong.js, always asked for together). Root-anchored, and the site has no /static or /Public.
    "~*^/(Public/home/js|static/admin/javascript)(/|\?|$)" 1;
    # Embedded-device firmware probe (/session?aimGetProp=fwVersion); the parameter name is what makes it a probe.
    "~*^/session\?([^#]*&)?aimGetProp=" 1;
    # Gitea repository search and Casdoor logo-setting API guesses (/api/v1/repos/search?limit=1, /api/get-logo-setting);
    # this API has neither, and the real laws API lives at /api/v1/laws.
    "~*^/api/(v1/repos(/[^?]*)?|get-logo-setting)(\?|$)" 1;
    # Apache Tomcat Manager console (/manager/html) and ConnectWise ScreenConnect installer probes
    # (/Bin/ScreenConnect.ClientSetup.msi?e=Access&y=Guest). The site runs neither; /manager alone and /law/manager/html still pass.
    "~*^/manager/(html|text|status)(/|\?|$)" 1;
    "~*^[^?]*(^|/)ScreenConnect\.[^/?]*(\?|$)" 1;
    # Shop and account guesses from a browser-agent sweep (/registration, /cart, /basket, /product, /customer/account/create,
    # /my-account/register). The site has no accounts or shop; exact names, so /law/cart and ?q=cart pass. /signup, /sign-up and
    # /register are left out on purpose: good-faith crawlers ask for them and must get a real 404.
    "~*^/(registration|cart|basket|product|my-account/register|customer/account/create)/?(\?|$)" 1;
    # Front-end bundle and source-map guesses at the root (/main.js, /app.js.map, /static/js/main.js) from one address that
    # rotated browser agents through twelve names in two minutes. The real bundles are hashed files under /assets/, which
    # this does not touch, and the site has no /static. Root-anchored, so /law/main.js and ?q=main.js pass.
    "~*^/((main|app|index|bundle|vendor)\.js(\.map)?|static/js/[^?]*)(\?|$)" 1;
    # Build, CI and deploy-config file guesses from a secrets sweep (/ansible.cfg, /aws.sh, /backup.sh, /build.sh,
    # /babel.config.js, /behat.yml, /bower.json, /Cakefile, /azure-pipelines.yml, /bitbucket-pipelines.yml, /azuredeploy.json,
    # /awsconfiguration.json, /ci/phpci.yml, /collibra.properties). This site publishes none of them. Exact file names with a
    # segment boundary, so /law/build-sh-tips and ?q=build.sh pass.
    "~*^[^?]*(^|/)(ansible\.cfg|(aws|backup|build)\.sh|babel\.config\.js|behat\.ya?ml|bower\.json|Cakefile|azure-pipelines\.ya?ml|bitbucket-pipelines\.ya?ml|azuredeploy\.json|awsconfiguration\.json|phpci\.ya?ml|collibra\.properties)(\?|$)" 1;
    # Framework config and backup-dump guesses: Magento and Pimcore files under /app/config and /app/etc (the local.xml rule above
    # takes only the exact name, not /app/etc/local.xml.additional) and a JSON backup dump (/backup/ovh-backups.json). Root-anchored;
    # /backup/restore and /law/backup still pass.
    "~*^/(app/(config|etc)/[^?]+|backups?/[^/?]+\.json)(\?|$)" 1;
    # Laravel Clockwork (/__clockwork/latest) and the Craft CMS debug toolbar (/actions/debug/default/...), the same debug-panel
    # family as _debugbar and the Yii toolbar above. The site runs neither.
    "~*^/(actions/debug|__clockwork)(/|\?|$)" 1;
    # Code-forge, Bitbucket, GitHub Enterprise and appliance API sweeps (GitLab /api/v4/..., GitHub /api/v3/..., Bitbucket
    # /rest/api/1.0/... and /rest/keys/1.0/..., GitHub Enterprise /setup/api and /stafftools, Gitea and GitLab /explore/..., the
    # GitLab /-/readiness probe, CouchDB /_all_dbs and the LiteLLM /public/model_hub/info page). The real API lives under /api/v1.
    "~*^/(api/(v3|v4)|rest/(api|keys)|setup/api|explore/(snippets|repos)|stafftools|-/readiness|_all_dbs|public/model_hub)(/[^?]*)?(\?|$)" 1;
    # Grafana, Prometheus, Canal, Postman and crypto-wallet API guesses (/api/frontend/settings, /api/datasources,
    # /api/v1/status/config, /api/v1/targets, /api/v1/canal/..., /api/v1/users/search, /api/send-options/..., /api/cw,
    # /api/staking/apy) and a version probe. The site has none of these under /api; /api/v1/users and /api/v1/laws still pass.
    "~*^/api/(frontend/settings|datasources|requestlogs|postman\.json|cw|staking|send-options|v1/(status/(config|flags)|targets|canal|users/search|version))(/[^?]*)?(\?|$)" 1;
    # Account-page guesses from a browser-agent sweep (/account/login, /auth/login, /customer/account/login, /user/sign_up, /entrar).
    # The site has no accounts; exact names. /signin and /sign-in are left alone like /signup and /sign-up: good-faith crawlers ask for them.
    "~*^/(account/login|auth/login|customer/account/login|user/sign_up|entrar)/?(\?|$)" 1;
    # Theme and panel asset guesses for proxy-panel software (v2board, SSPanel, Argon theme) and a script name from the same sweep.
    # The site has no /theme or /static/sspanel; the real bundles are hashed files under /assets/, which this does not touch.
    "~*^/((theme|static/sspanel)(/[^?]*)?|assets/js/fuck\.js)(\?|$)" 1;
    # Reconnaissance probes with a random hex suffix (/reconx-a90061322112, /www.git/reconx-...). No real URL starts with reconx-.
    "~*^/(www\.git/)?reconx-[0-9a-f]+(\?|$)" 1;
    # Network-monitoring tool guesses from one address (Cacti under several names, NMS, graph and monitor pages). The site has none.
    # Exact names with an optional /lab/ prefix for cacti, so /law/monitor and ?q=cacti pass. /stats is left alone: it could become a page.
    "~*^/((lab/)?cacti[a-z0-9.-]*|nms|network-monitoring|monitoring|monitor|graphs|graphing)/?(\?|$)" 1;
}

# A POST to exactly "/" (no query string: $request_uri includes it). It is a static page and nothing
# posts to it; the site's own POSTs go to /api and /subscription/*.
map "$request_method $request_uri" $scanner_post_root {
    default 0;
    "POST /" 1;
}

# Block when the agent, the path or the method-and-path is a scanner.
map "$scanner_agent$scanner_path$scanner_post_root" $block_request {
    default 1;
    "000" 0;
}

# Timing log. The built-in "combined" format of access.log has no timings and other tools parse it (the daily report,
# log-analyzer.sh, the triage-404s skill), so it stays as it is. access_timed.log carries the same fields plus
# the request time and the upstream (Node) times, which are "-" for files nginx serves itself. Logrotate
# covers it through the /var/log/nginx/*.log rule. Nothing reads this log automatically.
log_format timed '$remote_addr - $remote_user [$time_local] "$request" '
                 '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                 'rt=$request_time urt="$upstream_response_time" uct="$upstream_connect_time" '
                 'proto=$server_protocol';

# Blocked hits go to their own log (read by fail2ban) so the main access log
# and the daily 404 report only show real traffic.
map $block_request $log_normal {
    0 1;
    1 0;
}

server {
    server_name murphys-laws.com;

    # Drop scanners without a response. This runs before the trailing-slash
    # rewrite so probes are never redirected.
    if ($block_request) {
        return 444;
    }
    access_log /var/log/nginx/access.log combined if=$log_normal;
    access_log /var/log/nginx/access_timed.log timed if=$log_normal;
    access_log /var/log/nginx/scanner.log combined if=$block_request;

    # Frontend - Serve static files from dist directory
    root /root/murphys-laws/web/dist;
    index index.html;

    # Compression. The http block in /etc/nginx/nginx.conf turns gzip on but leaves gzip_types at its
    # default (text/html only), so scripts, styles, JSON, XML and SVG went out uncompressed. These apply to
    # every location of this server, for the listed types and text/html. Level 5 is the usual speed/size
    # trade-off on a 1 vCPU box; hashed assets skip it altogether through the precompressed .gz and .br files
    # (gzip_static and brotli_static below).
    # Brotli exists only as brotli_static on the hashed assets; there is no dynamic "brotli on", everything else is
    # compressed with gzip. The directive comes from the libnginx-mod-http-brotli-static package, which must be
    # installed before this file is deployed: without it nginx -t rejects brotli_static as an unknown directive
    # (shared/docs/DEPLOYMENT.md, section "Brotli for the precompressed assets", has the install order).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/plain
        text/xml;

    # Character set. Without it a plain-text file (robots.txt, llms.txt, llms-full.txt hold a few non-ASCII
    # characters) or a sitemap went out with no charset, and a browser that has to guess may read UTF-8 as
    # Windows-1252 and show mojibake. At server level so every location inherits it. nginx adds it only to the types in
    # charset_types (its default: text/html, text/xml, text/plain, application/javascript and a few feed types;
    # on nginx 1.24 that includes scripts, which mime.types maps to application/javascript) and
    # only when the response has no charset yet, so a proxied API response keeps its own.
    charset utf-8;

    # Public application URLs are canonical without a trailing slash.
    rewrite ^/(.+)/$ /$1 permanent;

    # Pages from the previous site layout (file names are case-sensitive) that still get backlinks and
    # bot traffic. Each one with a current equivalent has an exact redirect; location = matches the path
    # without its query string. Anything else under /murphy/ gets the 410 below.
    location = /murphy/murphy-true.html {
        return 301 https://murphys-laws.com/origin-story;
    }
    location = /murphy/life-by-murphys-law.html {
        return 301 https://murphys-laws.com/examples;
    }
    location = /murphy/about.html {
        return 301 https://murphys-laws.com/about;
    }
    location = /murphy/contact.html {
        return 301 https://murphys-laws.com/contact;
    }
    location = /murphy/murphy-laws.html {
        return 301 https://murphys-laws.com/category/murphys-laws;
    }
    location = /murphy/murphy-laws {
        return 301 https://murphys-laws.com/category/murphys-laws;
    }
    location = /murphy/murphy-love.html {
        return 301 https://murphys-laws.com/category/murphys-love-laws;
    }
    location = /murphy/murphy-technology.html {
        return 301 https://murphys-laws.com/category/murphys-technology-laws;
    }
    location = /murphy/murphy-computer.html {
        return 301 https://murphys-laws.com/category/murphys-computer-laws;
    }
    location = /murphy/murphy-commerce.html {
        return 301 https://murphys-laws.com/category/murphys-commerce-laws;
    }
