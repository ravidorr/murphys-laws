# Nginx configuration for Murphy's Laws
# Copy this to /etc/nginx/sites-available/murphys-laws on the droplet
#
# This configuration serves pre-built static files from the dist directory.
# The deployment process builds locally and syncs dist/ to the server.
# No Vite preview server is used in production.

# Scanner defense. This file is installed in sites-available, which nginx
# includes inside the http block, so these top-level maps are http-context.

# Exploit-kit and scanner user agents (seen in the logs: libredtail-http).
map $http_user_agent $scanner_agent {
    default 0;
    ~*(libredtail|masscan|zgrab|nikto|sqlmap|nuclei|rawgrab) 1;
}

# Paths no visitor of this site requests: dotfiles with secrets, source control,
# cloud credentials, CMS/PHP/Java/Oracle exploit paths, config and backup files.
# Patterns are anchored to the path (^[^?]*) so a search such as /browse?q=error.log is never blocked.
map $request_uri $scanner_path {
    default 0;
    # Any dot-directory or dotfile (.env*, .git, .aws, .config, .htaccess, ...) except .well-known.
    "~*^[^?]*(^|/)\.(?!well-known(/|$))" 1;
    # Percent-encoded evasion: an encoded dot or percent in the path, or three
    # or more encoded printable characters in a row (%65%6e%76 for "env").
    "~*^[^?]*%(25|2e)" 1;
    "~*^[^?]*(%[2-7][0-9a-f]){3}" 1;
    "~*^[^?]*(^|/)(wp|wp-admin|wp-login|wp-content|wp-includes|wp-json|xmlrpc|wordpress)([./?]|$)" 1;
    "~*^[^?]*\.(php|asp|aspx|jsp|cgi|sql|bak|old|save|swp|orig|ini|log|tar|gz|zip)(\?|$)" 1;
    "~*^[^?]*(^|/)(phpunit|phpinfo|_profiler|actuator|oa_html|cgi-bin|phpmyadmin|administrator)([/?]|$)" 1;
    "~*^[^?]*(^|/)vendor/phpunit" 1;
    "~*^[^?]*(^|/)owa/auth" 1;
    # Network-appliance and file-transfer exploit probes: SonicWall SonicOS and CrushFTP.
    "~*^[^?]*(^|/)(sonicos|WebInterface)([/?]|$)" 1;
    "~*^[^?]*(^|/)storage/logs" 1;
    "~*^[^?]*(^|/)(application(-[a-z]+)?\.(ya?ml|properties)|appsettings(\.[a-z]+)?\.json)(\?|$)" 1;
    "~*^[^?]*(^|/)(serviceaccount|service-account|gcloud-service-key)\.json(\?|$)" 1;
    "~*^[^?]*(^|/)(aws-exports|env)\.js(\?|$)" 1;
    "~*^[^?]*(^|/)(config|configuration|settings|secrets?|credentials|keys?)\.(json|ya?ml|js|toml|xml|txt|php)(\?|$)" 1;
    "~*^[^?]*(^|/)credentials(\?|$)" 1;
    "~*^[^?]*\.env(\?|$)" 1;
    "~*^[^?]*(^|/)(composer\.(lock|json)|package(-lock)?\.json|parameters\.ya?ml|settings\.py|wp-config[^/]*|containers/json)(\?|$)" 1;
    "~*^[^?]*(^|/)config/(aws|azure|gcp|database|secrets?)(\.|/|\?|$)" 1;
    "~*^[^?]*(^|/)latest/meta-data" 1;
    "~*^[^?]*(^|/)(docker-compose[^/]*\.ya?ml|Dockerfile[^/]*)(\?|$)" 1;
    "~*^[^?]*(^|/)(readme\.html|license\.txt)(\?|$)" 1;
    "~*(allow_url_include|auto_prepend_file)" 1;
    # Guessed-path sweeps for pages and endpoints this site does not have: signup and account forms,
    # generic company-site pages, and API/auth guesses. Anchored to the whole path, so a future page
    # with one of these names must be removed here (the test lists the real routes that must pass).
    "~*^/(account/(create|register)|auth/(signup|register)|users/(sign_in|sign_up)|create-account|email-signup|footer-signup|contact-form)/?(\?|$)" 1;
    "~*^/(company|leistungen|our-team|products|services|servicios|team|vpn)/?(\?|$)" 1;
    "~*^/(api/usage/stats/?|v1/auth/[^?]*)(\?|$)" 1;
    # Wallet top-up guesses, Laravel/Vite build-manifest probes and IPFS gateway probes: no such routes here.
    "~*^/((wallet|ipfs)(/[^?]*)?|build/manifest\.json)(\?|$)" 1;
    # Jenkins CSRF-token discovery, AI-sandbox code-execution endpoints and stack fingerprinting
    # (/health, /health/... and /version at the root; this site's real health check is /api/health).
    "~*^/(crumbIssuer(/[^?]*)?|run/?|health(/[^?]*)?|version/?|(api/v1/)?code/blocks/exec/[a-z/]+)(\?|$)" 1;
}

# A POST to exactly "/" (no query string: $request_uri includes it). It is a static page and nothing
# posts to it; the site's own POSTs go to /api and /subscription/*.
map "$request_method $request_uri" $scanner_post_root {
    default 0;
    "POST /" 1;
}

# Block when the agent, the path or the method-and-path is a scanner.
map "$scanner_agent$scanner_path$scanner_post_root" $block_request {
    default 1;
    "000" 0;
}

# Blocked hits go to their own log (read by fail2ban) so the main access log
# and the daily 404 report only show real traffic.
map $block_request $log_normal {
    0 1;
    1 0;
}

server {
    server_name murphys-laws.com;

    # Drop scanners without a response. This runs before the trailing-slash
    # rewrite so probes are never redirected.
    if ($block_request) {
        return 444;
    }
    access_log /var/log/nginx/access.log combined if=$log_normal;
    access_log /var/log/nginx/scanner.log combined if=$block_request;

    # Frontend - Serve static files from dist directory
    root /root/murphys-laws/web/dist;
    index index.html;

    # Public application URLs are canonical without a trailing slash.
    rewrite ^/(.+)/$ /$1 permanent;

    # Pages from the previous site layout that still get backlinks and bot traffic.
    location = /murphy/murphy-true.html {
        return 301 https://murphys-laws.com/examples;
    }
    location = /murphy/murphy-technology.html {
        return 301 https://murphys-laws.com/category/murphys-technology-laws;
    }
    location = /murphy/murphy-laws.html {
        return 301 https://murphys-laws.com/category/murphys-laws;
    }
    location = /murphy/murphy-computer.html {
        return 301 https://murphys-laws.com/category/murphys-computer-laws;
    }
    location = /murphy/murphy-teaching.html {
        return 301 https://murphys-laws.com/category/murphys-teaching-laws;
    }
    location = /murphy/murphy-cas.htm {
        return 301 https://murphys-laws.com/category/murphys-cowboy-action-shooting-cas-laws;
    }
    location = /murphy/murphy-cars.htm {
        return 301 https://murphys-laws.com/category/murphys-cars-laws;
    }
    location = /murphy/contact.html {
        return 301 https://murphys-laws.com/contact;
    }
    # Crawlers guess the common -us slugs for the existing About and Contact pages.
    location = /about-us {
        return 301 https://murphys-laws.com/about;
    }
    location = /contact-us {
        return 301 https://murphys-laws.com/contact;
    }
    location = /old/index.htm {
        return 301 https://murphys-laws.com/;
    }
    # The previous site's home page; crawlers still request it.
    location = /index.htm {
        return 301 https://murphys-laws.com/;
    }
    # The trailing-slash rewrite above turns the old /murphy/ index links into /murphy, which has no page.
    location = /murphy {
        return 301 https://murphys-laws.com/;
    }
    # Any other old /murphy/ page goes home. ^~ stops regex locations from winning.
    location ^~ /murphy/ {
        return 301 https://murphys-laws.com/;
    }

    # Apple devices ask for the precomposed icon first.
    location = /apple-touch-icon-precomposed.png {
        return 301 https://murphys-laws.com/apple-touch-icon.png;
    }

    # iOS Safari also asks for sized Apple icons; the one icon we have answers all of them.
    location = /apple-touch-icon-240x240.png {
        return 301 https://murphys-laws.com/apple-touch-icon.png;
    }
    location = /apple-touch-icon-240x240-precomposed.png {
        return 301 https://murphys-laws.com/apple-touch-icon.png;
    }

    # Older copies of our structured data pointed the logo at /favicon-512x512.png, which was never published.
    location = /favicon-512x512.png {
        return 301 https://murphys-laws.com/android-chrome-512x512.png;
    }

    # RFC 9116 allows /security.txt as a fallback for /.well-known/security.txt; crawlers still ask for it.
    location = /security.txt {
        return 301 https://murphys-laws.com/.well-known/security.txt;
    }

    # Crawlers guess these two names: Bing asks for /sitemaps.xml and some bots for /favicon.png.
    location = /sitemaps.xml {
        return 301 https://murphys-laws.com/sitemap.xml;
    }
    location = /favicon.png {
        return 301 https://murphys-laws.com/favicon-32x32.png;
    }

    # Google's prefetch proxy asks for this file; answer instead of logging a 404.
    location = /.well-known/traffic-advice {
        default_type application/trafficadvice+json;
        return 200 '[{"user_agent":"prefetch-proxy","google_prefetch_proxy_eap":{"fraction":1.0}}]';
    }

    # RFC 9116 security contact, mirroring SECURITY.md. Expires must be renewed before it passes.
    location = /.well-known/security.txt {
        default_type text/plain;
        charset utf-8;
        return 200 "Contact: https://github.com/ravidorr/murphys-laws/security/advisories/new\nExpires: 2027-11-06T00:00:00.000Z\nPolicy: https://github.com/ravidorr/murphys-laws/blob/main/SECURITY.md\nCanonical: https://murphys-laws.com/.well-known/security.txt\n";
    }

    # TDM Reservation Protocol: robots.txt already welcomes AI crawlers, so say the same
    # in machine-readable form (tdm-reservation 0 = text and data mining is not reserved).
    location = /.well-known/tdmrep.json {
        default_type application/json;
        return 200 '[{"location":"/*","tdm-reservation":0}]';
    }

    # Category slugs were corrected in the API. Preserve their search equity
    # and avoid serving the SPA's misleading empty-category state.
    location = /category/murphys-cars-4x4-laws {
        return 301 https://murphys-laws.com/category/murphys-4x4-car-laws$is_args$args;
    }
    location = /category/murphys-cars-open-road-laws {
        return 301 https://murphys-laws.com/category/murphys-law-of-the-open-road$is_args$args;
    }
    location = /category/murphys-computers-laws {
        return 301 https://murphys-laws.com/category/murphys-computer-laws$is_args$args;
    }
    location = /category/murphys-cowboy-action-shooting-laws {
        return 301 https://murphys-laws.com/category/murphys-cowboy-action-shooting-cas-laws$is_args$args;
    }
    location = /category/murphys-helicopters-war-laws {
        return 301 https://murphys-laws.com/category/murphys-helicopters-warfare-laws$is_args$args;
    }
    location = /category/murphys-marine-corp-laws {
        return 301 https://murphys-laws.com/category/murphys-marine-corps-laws$is_args$args;
    }
    location = /category/murphys-mechanics-laws {
        return 301 https://murphys-laws.com/category/murphys-laws-of-mechanics$is_args$args;
    }
    location = /category/murphys-repairmen-laws {
        return 301 https://murphys-laws.com/category/murphys-repairmans-laws$is_args$args;
    }
    location = /category/murphys-tanks-war-laws {
        return 301 https://murphys-laws.com/category/murphys-tank-warfare-laws$is_args$args;
    }

    # Preserve direct visits to calculator routes kept by the client router.
    location = /calculator {
        return 301 https://murphys-laws.com/calculator/sods-law$is_args$args;
    }
    location = /toastcalculator {
        return 301 https://murphys-laws.com/calculator/buttered-toast$is_args$args;
    }

    # Pre-rendered routes are preferred, but new laws and categories can be
    # published after the last SSG build. Let the API render only those known
    # dynamic route patterns; unrelated paths still reach the static 404.
    location ~ ^/law/\d+$ {
        try_files $uri/index.html @law-detail;
    }
    location ~ ^/category/[^/]+$ {
        try_files $uri/index.html @category-detail;
    }

    # Embeddable law cards. The backend renders them (they are never prerendered) and they must stay
    # framable, so no X-Frame-Options or frame-ancestors header is sent here.
    location ~ ^/embed/(law/\d+|law-of-day)/?$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Daily email confirm and unsubscribe pages (the emails link here); the backend renders them.
    location ~ ^/subscription/(confirm|unsubscribe)/?$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin moderation page. The backend serves it (and 404s unless ADMIN_API_TOKEN or the GitHub sign-in
    # is configured); its assets load from /api/v1/admin/ui/*, covered by /api below.
    # The trailing-slash rewrite above sends /admin/ to /admin.
    location = /admin {
        proxy_pass http://127.0.0.1:8787;
        # A disabled admin page (404) must look like any other missing page.
        proxy_intercept_errors on;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # Serve the pre-rendered route without redirecting to its directory URL.
        # Unknown routes must return a real 404, not an indexable SPA soft-404.
        try_files $uri/index.html $uri =404;
        
        # Cache control for static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, no-transform";
        }
    }

    location @law-detail {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }

    location @category-detail {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
    }

    # A client that sends plain HTTP to this TLS port is a scanner: browsers never do. nginx raises
    # error 497 and would answer "400 The plain HTTP request was sent to HTTPS port", which lands in
    # the main access log and the daily report. Drop it without a response like the other scanner
    # hits and log it to scanner.log. The "=444" makes the log line say 444 (without it nginx logs
    # 400), which is what the fail2ban filter counts as a strike.
    error_page 497 =444 @plain_http_on_tls;
    location @plain_http_on_tls {
        access_log /var/log/nginx/scanner.log combined;
        return 444;
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # OG Images - dynamic images for social sharing
    # These are generated on-demand by the backend and should be cached
    location ~ ^/api/v1/og/law/\d+\.png$ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache OG images for 1 day at nginx level
        proxy_cache_valid 200 1d;
        proxy_cache_valid 404 1m;
        
        # Add cache headers for downstream caches and browsers
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # API - proxies to Node.js API server
    location /api {
        # Googlebot's robots.txt group does not disallow /api/ (the pages fetch their data from it while
        # rendering), so it crawls the JSON endpoints as pages and reports them as "crawled, not indexed".
        # Keep them out of the index without blocking the fetch. This applies to every crawler, including
        # the AI crawlers whose robots.txt groups allow /api/: they can still fetch, only search engines
        # skip indexing. The OG image location above has its own headers.
        add_header X-Robots-Tag "noindex" always;
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/murphys-laws.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/murphys-laws.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Canonical host redirect.
server {
    listen 443 ssl;
    server_name www.murphys-laws.com;

    if ($block_request) {
        return 444;
    }
    access_log /var/log/nginx/access.log combined if=$log_normal;
    access_log /var/log/nginx/scanner.log combined if=$block_request;

    ssl_certificate /etc/letsencrypt/live/murphys-laws.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/murphys-laws.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # A client that sends plain HTTP to this TLS port is a scanner: browsers never do. nginx raises
    # error 497 and would answer "400 The plain HTTP request was sent to HTTPS port", which lands in
    # the main access log and the daily report. Drop it without a response like the other scanner
    # hits and log it to scanner.log. The "=444" makes the log line say 444 (without it nginx logs
    # 400), which is what the fail2ban filter counts as a strike.
    error_page 497 =444 @plain_http_on_tls;
    location @plain_http_on_tls {
        access_log /var/log/nginx/scanner.log combined;
        return 444;
    }

    return 301 https://murphys-laws.com$request_uri;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name murphys-laws.com www.murphys-laws.com;

    if ($block_request) {
        return 444;
    }
    access_log /var/log/nginx/access.log combined if=$log_normal;
    access_log /var/log/nginx/scanner.log combined if=$block_request;

    return 301 https://murphys-laws.com$request_uri;
}
