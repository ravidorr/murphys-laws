# Install on the droplet as /etc/fail2ban/filter.d/nginx-scanner.conf
#
# Two kinds of line count as a strike; the jail reads both logs through both patterns.
#
# 1. A 444. nginx.conf answers scanner requests with 444 and logs those hits to
#    /var/log/nginx/scanner.log. A follow-up line there with another status (for example a
#    400 from the same client) does not count, unless it is a junk request line as in 2.
# 2. A 400 for a request line that almost no browser or API client sends, read from
#    /var/log/nginx/access.log. nginx rejects these while it parses the request, before the
#    rules that return 444 can run, so they never reach scanner.log. They are:
#    - the HTTP/2 preface (PRI *);
#    - a TLS handshake or other binary bytes sent to a plain-HTTP port. nginx logs each
#      non-printable byte as \xNN and browsers percent-encode, so a request line with \xNN in it
#      is a probe. \x22 (a quote) and \x5C (a backslash) are not counted: a hand-typed URL can
#      hold them and nginx escapes them the same way;
#    - a request line that starts with CONNECT (proxy probes), SSTP_ (VPN probes such as
#      SSTP_DUPLEX_POST), MGLNDD_ (a scanner banner) or "t3 " and a digit (the WebLogic
#      "t3 12.1.2" handshake);
#    - a request line that is only an upper-case word with no path, such as "GET".
#    Any other 400 is left alone: a normal GET (Censys and similar crawlers), a malformed
#    encoding in a real URL, and the ..%2F path-traversal probe.
#
#    The pattern is anchored to the first quoted field, the request line ([^"]* cannot cross a
#    quote, because nginx logs a quote as \x22), and the \xNN test is a lookahead, so a long
#    User-Agent on an ordinary request cannot make it backtrack.
#
# fail2ban removes the timestamp from the line before matching, so the pattern must
# not depend on the bracketed date of the nginx "combined" log format. It also trims
# trailing whitespace from the value, so the end of the pattern uses \s, not a space.
#
# After installing or editing, check it against the real logs; the first must report matches:
#   sudo fail2ban-regex /var/log/nginx/scanner.log /etc/fail2ban/filter.d/nginx-scanner.conf
#   sudo fail2ban-regex /var/log/nginx/access.log /etc/fail2ban/filter.d/nginx-scanner.conf
[Definition]
failregex = ^<HOST> .*" 444\s
            ^<HOST> [^"]*"(?:(?:PRI \*|CONNECT |SSTP_|MGLNDD_|t3 [0-9])[^"]*|(?=[^"]*\\x(?!5[Cc]|22)[0-9A-Fa-f]{2})[^"]*|[A-Z]+)" 400\s
ignoreregex =
