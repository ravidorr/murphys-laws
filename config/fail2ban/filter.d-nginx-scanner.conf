# Install on the droplet as /etc/fail2ban/filter.d/nginx-scanner.conf
#
# nginx.conf answers scanner requests with 444 and logs those hits to
# /var/log/nginx/scanner.log. Only the 444 lines count as strikes; the log can also
# hold a follow-up line with another status (for example a 400 from the same client).
#
# fail2ban removes the timestamp from the line before matching, so the pattern must
# not depend on the bracketed date of the nginx "combined" log format. It also trims
# trailing whitespace from the value, so the end of the pattern uses \s, not a space.
#
# After installing or editing, check it against the real log; it must report matches:
#   sudo fail2ban-regex /var/log/nginx/scanner.log /etc/fail2ban/filter.d/nginx-scanner.conf
[Definition]
failregex = ^<HOST> .*" 444\s
ignoreregex =
