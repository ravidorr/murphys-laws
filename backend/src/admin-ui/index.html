<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Murphy's Laws moderation</title>
  <link rel="stylesheet" href="/api/v1/admin/ui/admin.css">
</head>
<body>
  <header class="bar">
    <h1>Law moderation</h1>
    <div id="session" class="session" hidden>
      <span>Signed in as <strong id="session-login"></strong></span>
      <button type="button" id="sign-out" class="btn">Sign out</button>
    </div>
  </header>

  <main>
    <section id="signin" class="card card--section signin-card" aria-labelledby="signin-title">
      <div class="card-header"><h2 id="signin-title" class="card-title">Admin sign-in</h2></div>
      <div class="card-body">
        <p id="signin-intro" class="signin-note">Sign in with the GitHub account approved for moderation.</p>
        <a id="github-signin" class="btn btn-primary btn-block" href="/api/v1/admin/auth/github" hidden>
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 .5a11.5 11.5 0 0 0-3.64 22.41c.58.1.79-.25.79-.56v-2c-3.2.7-3.88-1.37-3.88-1.37-.52-1.33-1.28-1.69-1.28-1.69-1.04-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.77 2.7 1.26 3.36.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.69 0-1.26.45-2.28 1.19-3.08-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.17 1.18a11 11 0 0 1 5.77 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.23 2.76.11 3.05.74.8 1.19 1.82 1.19 3.08 0 4.42-2.69 5.39-5.25 5.68.41.36.78 1.06.78 2.13v3.16c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .5z"/></svg>
          <span>Sign in with GitHub</span>
        </a>
        <div class="divider" role="separator"><span>or</span></div>
        <details id="token-fallback" class="token-fallback">
          <summary class="btn btn-block">Use an API token</summary>
          <form id="connect-form" class="connect" autocomplete="off">
            <div class="field">
              <label for="token">Admin token</label>
              <input id="token" name="token" type="password" required autocomplete="off" spellcheck="false">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Connect</button>
          </form>
        </details>
      </div>
      <div id="signin-footer" class="card-footer" hidden>GitHub sign-in is not enabled on this server.</div>
    </section>

    <div id="toolbar" class="toolbar" hidden>
      <div class="tabs" id="tabs" role="group" aria-label="Filter by status"></div>
      <form id="search-form" class="search" role="search">
        <label for="search" class="visually-hidden">Search laws</label>
        <input id="search" name="q" type="search" placeholder="Search title or text">
        <button type="submit" class="btn">Search</button>
      </form>
    </div>

    <p id="message" class="message" role="status" aria-live="polite"></p>
    <ul id="laws" class="laws"></ul>

    <nav id="pager" class="pager" aria-label="Pagination" hidden>
      <button type="button" id="prev" class="btn">Previous</button>
      <span id="page-label"></span>
      <button type="button" id="next" class="btn">Next</button>
    </nav>
  </main>

  <script type="module" src="/api/v1/admin/ui/admin.js"></script>
</body>
</html>
